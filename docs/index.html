/* Warm und ruhig: sandfarbene Grundfläche, weiße Karten, Terrakotta für Handlungen, Grün für Erledigtes */
:root {
  --grund: #eef2ec;
  --karte: #ffffff;
  --text: #1f2a23;
  --leise: #5a6a5e;
  --linie: #cfdacd;
  --blau: #4a6b55;
  --blau-dunkel: #3a5544;
  --blau-hell: #e1eadf;
  --gelb-hell: #fff6dc;
  --gelb-rand: #e0a400;
  --rot: #c4241b;
  --fokus: #4a6b55;
  --schatten: 0 1px 2px rgba(0, 0, 0, .06), 0 6px 20px rgba(0, 0, 0, .06);
  --rund: 22px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { font-size: 125%; -webkit-text-size-adjust: 100%; }
html.gross { font-size: 150%; }
body {
  margin: 0;
  background: var(--grund);
  color: var(--text);
  font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 1rem;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; letter-spacing: 0; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--fokus); outline-offset: 3px; }
[hidden] { display: none !important; }

/* Symbole */
.ico { display: inline-flex; align-items: center; justify-content: center; flex: none; color: #fff; background: var(--farbe, var(--blau)); }
.ico svg { width: 60%; height: 60%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.klein { width: 2rem; height: 2rem; border-radius: 9px; }
.ico.mittel { width: 3rem; height: 3rem; border-radius: 50%; }
.ico.gross { width: 4.2rem; height: 4.2rem; border-radius: 50%; box-shadow: 0 6px 18px color-mix(in srgb, var(--farbe) 35%, transparent); }

/* Knöpfe */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  min-height: 52px; padding: .55em 1.3em;
  font: inherit; font-weight: 600;
  border: none; border-radius: 999px;
  background: var(--blau-hell); color: var(--blau);
  cursor: pointer; text-align: center;
  transition: transform .12s ease, background-color .15s ease;
}
.btn:hover { background: #d3e0d1; }
.btn:active { transform: scale(.97); }
.btn.primaer { background: var(--blau); color: #fff; }
.btn.primaer:hover { background: var(--blau-dunkel); }
.videobereich { display: grid; gap: .8rem; }
.videonachricht { width: 100%; max-height: 60vh; border-radius: var(--rund); background: #000; }
.scanfelder { display: grid; gap: 1rem; margin: 1rem 0; }
#dialog progress { width: 100%; height: 1rem; margin-top: .8rem; }
.neueversion { position: fixed; left: 50%; bottom: max(1rem, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(40rem, calc(100% - 2rem)); display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--karte); border-radius: var(--rund); padding: 1rem 1.2rem; box-shadow: 0 8px 30px rgba(0,0,0,.18); z-index: 50; }
@media print { .neueversion { display: none; } }
.btn.riesig { min-height: 64px; font-size: 1.15rem; padding: .6em 1.7em; }
.btn[aria-pressed="true"] { background: var(--blau); color: #fff; }
.btn.flach { background: transparent; padding-left: .4em; padding-right: .6em; }
.btn.flach:hover { background: var(--blau-hell); }

/* Kopfleiste */
.kopf {
  position: sticky; top: 0; z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem;
  padding: .6rem 1.25rem;
  background: rgba(238, 242, 236, .9);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(0, 0, 0, .08);
}
.marke { display: flex; align-items: center; gap: .55rem; font-size: 1.2rem; font-weight: 700; margin-right: auto; }
.marke .logo { width: 2.2rem; height: 2.2rem; border-radius: 22%; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
.dateistatus { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .5rem; font-size: .8rem; color: var(--leise); min-width: 0; }
.dateistatus .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 16rem; }
.dateistatus .pille { background: var(--karte); border-radius: 999px; padding: .3em .85em; box-shadow: var(--schatten); }
.dateistatus .pille.offen { background: #fde8e6; color: var(--rot); font-weight: 600; box-shadow: none; }
.dateistatus .pille.ok { background: #dcebdc; color: #2f5a3a; box-shadow: none; }
.aktionen { display: flex; flex-wrap: wrap; gap: .5rem; }
.kopf .btn { min-height: 48px; padding: .45em 1.1em; }

/* Startseite */
.start { max-width: 48rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
.held {
  position: relative; overflow: hidden;
  background: var(--karte); border-radius: 32px; box-shadow: var(--schatten);
  padding: 3.2rem 2rem 2.6rem; text-align: center;
}
.blasen { position: absolute; inset: 0; pointer-events: none; }
.blase { position: absolute; border-radius: 50%; opacity: .9; animation: schweben 9s ease-in-out infinite; }
.blase:nth-child(1) { width: 7rem; height: 7rem; left: -2rem; top: -2rem; background: #ffd34d; }
.blase:nth-child(2) { width: 3.2rem; height: 3.2rem; left: 12%; bottom: 1.2rem; background: #ff6b6b; animation-delay: -3s; }
.blase:nth-child(3) { width: 5.5rem; height: 5.5rem; right: -1.5rem; top: 2.5rem; background: #5ac8fa; animation-delay: -5s; }
.blase:nth-child(4) { width: 2.2rem; height: 2.2rem; right: 18%; top: 1.2rem; background: #34c759; animation-delay: -1.5s; }
.blase:nth-child(5) { width: 4rem; height: 4rem; right: 8%; bottom: -1.5rem; background: #af52de; animation-delay: -6.5s; }
.blase:nth-child(6) { width: 1.6rem; height: 1.6rem; left: 22%; top: 1.6rem; background: #ff9f0a; animation-delay: -4s; }
@keyframes schweben { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@media (prefers-reduced-motion: reduce) { .blase { animation: none; } .btn, .kachel { transition: none; } }
.held > *:not(.blasen) { position: relative; }
.held .logo-gross {
  width: 6rem; height: 6rem; border-radius: 50%; margin: 0 auto 1.3rem;
  background: #4a6b55;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 3.6rem; font-weight: 800; line-height: 1; letter-spacing: -.02em;
  box-shadow: 0 10px 30px rgba(74, 107, 85, .28);
}
.held h1 { font-size: 2.6rem; }
.blasen { display: none; }
.held .unterzeile { font-size: 1.3rem; color: var(--leise); margin-top: .5rem; }
.held .knopfreihe { justify-content: center; margin-top: 2rem; }

.vorteile { list-style: none; padding: 0; margin: 1.5rem 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .9rem; }
.vorteile li { display: flex; align-items: center; gap: .8rem; background: var(--karte); border-radius: var(--rund); padding: 1rem 1.1rem; box-shadow: var(--schatten); font-weight: 600; line-height: 1.25; }

.knopfreihe { display: flex; flex-wrap: wrap; gap: .75rem; }
.hinweis { background: var(--karte); border-radius: var(--rund); padding: 1.1rem 1.3rem; margin-top: 1.25rem; }
.hinweis.gelb { background: var(--gelb-hell); box-shadow: inset 0 0 0 2px var(--gelb-rand); }
.kleingedruckt { font-size: .85rem; color: var(--leise); margin-top: 1.5rem; text-align: center; max-width: 38rem; margin-left: auto; margin-right: auto; }

/* Arbeitsbereich */
.rahmen { display: grid; grid-template-columns: 1fr; }
.navigation { display: none; }
@media (min-width: 62.5em) {
  .rahmen { grid-template-columns: 20rem 1fr; }
  .navigation { display: block; padding: 1.25rem .9rem 2rem 1.1rem; position: sticky; top: 4.2rem; align-self: start; max-height: calc(100vh - 4.2rem); overflow-y: auto; }
  .zurueck-oben { display: none !important; }
}
.navgruppe { list-style: none; margin: 0 0 1rem; padding: .35rem; background: var(--karte); border-radius: var(--rund); box-shadow: var(--schatten); }
.navgruppe button {
  width: 100%; min-height: 52px; padding: .4em .6em;
  display: flex; align-items: center; gap: .75em;
  font: inherit; font-size: .95rem; text-align: left; color: var(--text);
  background: transparent; border: none; border-radius: 14px; cursor: pointer;
}
.navgruppe button:hover { background: var(--grund); }
.navgruppe button[aria-current="page"] { background: var(--blau); color: #fff; font-weight: 600; }

.inhalt { padding: 1.5rem 1.25rem 4rem; max-width: 56rem; width: 100%; margin: 0 auto; min-width: 0; }
.inhalt h2:focus { outline: none; }

.seitenkopf { display: flex; align-items: center; gap: 1.1rem; margin: .5rem 0 1.6rem; }
.seitenkopf h2 { font-size: 2.1rem; }
.seitenkopf p { font-size: 1.15rem; color: var(--leise); margin-top: .3rem; }
.zurueck-oben { margin: 0 0 .5rem -.4rem; }

.stand { display: inline-flex; align-items: center; gap: .5rem; background: var(--karte); border-radius: 999px; padding: .45em 1.1em; box-shadow: var(--schatten); font-size: 1rem; margin-top: .9rem; }

.kacheln { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: 1rem; }
.kachel {
  width: 100%; height: 100%; min-height: 9.5rem; padding: 1.2rem 1.2rem 1.1rem;
  display: flex; flex-direction: column; align-items: flex-start; gap: .9rem;
  font: inherit; text-align: left; color: var(--text);
  background: var(--karte); border: none; border-radius: var(--rund); box-shadow: var(--schatten);
  cursor: pointer; transition: transform .15s ease, box-shadow .15s ease;
}
.kachel:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 12px 28px rgba(0,0,0,.1); }
.kachel:active { transform: scale(.98); }
.kachel .name { display: block; font-size: 1.1rem; font-weight: 700; line-height: 1.2; }
.kachel .unter { display: block; font-size: .85rem; color: var(--leise); line-height: 1.3; margin-top: .2rem; }
.ring { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 4.1rem; height: 4.1rem; flex: none; }
.ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring > svg circle { fill: none; stroke-width: 5; }
.ring > svg .spur { stroke: #e3eae1; }
.ring > svg .wert { stroke-linecap: round; transition: stroke-dasharray .4s ease; }
.ring .ico.mittel { width: 2.9rem; height: 2.9rem; }
.seitenkopf > .ring { width: 5.2rem; height: 5.2rem; }

<body>

<script>
"use strict";

const SCHEMA_VERSION = 3;
const FORMAT = "klarordner";
const standardName = () => t("Mein Vorsorgeordner") + ".notfall.json";

const SPRACHEN = {
  de: "Deutsch", en: "English", tr: "Türkçe", ru: "Русский", uk: "Українська", pl: "Polski",
  ro: "Română", it: "Italiano", el: "Ελληνικά", hr: "Hrvatski", bg: "Български", cs: "Čeština",
  es: "Español", fr: "Français"

const MIGRATIONEN = {
  // Version 2: Auswahlfelder speichern neutrale Schlüssel statt deutscher Texte.
  1: d => {
    const setze = (obj, feldname, name) => { if (obj && typeof obj[feldname] === "string") obj[feldname] = normWert(obj[feldname], name); };
    const jede = (liste, f) => { if (Array.isArray(liste)) liste.forEach(f); };
    setze(d.persoenlich, "familienstand", "familienstand");
    jede(d.kontakte, k => setze(k, "rolle", "rolle"));
    setze(d.gesundheit, "organspende", "organspende");
    for (const v of ["vorsorgevollmacht", "betreuungsverfuegung", "patientenverfuegung", "bankvollmacht"]) {
      const block = d.vollmachten && d.vollmachten[v];
      setze(block, "vorhanden", "jaNein");
      setze(block, "registriert", "jaNein");
    }
    jede(d.finanzen && d.finanzen.konten, k => { setze(k, "kontoart", "kontoart"); setze(k, "vollmachtUeberTod", "jaNein"); });
    jede(d.versicherungen, v => setze(v, "art", "versicherung"));
    jede(d.vertraege, v => setze(v, "art", "vertrag"));
    setze(d.wohnen, "wohnform", "wohnform");
    jede(d.digital && d.digital.konten, k => { setze(k, "kategorie", "onlineArt"); setze(k, "wunsch", "wunsch"); });
    setze(d.sterbefall, "bestattungsart", "bestattung");
  },
  // Version 3: Klarordner ist ein Ordner für den Todesfall. Gesundheitsangaben entfallen,
  // Krankenkasse, Hausarzt und Organspende werden umgezogen, Vollmachten werden zu Testament und Vollmachten.
  2: d => {
    const g = d.gesundheit || {};
    d.persoenlich = d.persoenlich || {};
    if (g.krankenkasse) d.persoenlich.krankenkasse = { name: g.krankenkasse.name || "", versichertennummer: g.krankenkasse.versichertennummer || "" };
    d.sterbefall = d.sterbefall || {};
    if (g.hausarzt) d.sterbefall.hausarzt = { name: g.hausarzt.name || "", telefon: g.hausarzt.telefon || "" };
    if (g.organspende) d.sterbefall.organspende = g.organspende;
    if (g.ablageOrganspendeausweis) d.sterbefall.ablageOrganspendeausweis = g.ablageOrganspendeausweis;
    delete d.gesundheit;
    const v = d.vollmachten || {};
    const alt = b => b ? { vorhanden: b.vorhanden || "", bevollmaechtigt: b.bevollmaechtigt || "", ablage: b.ablage || "", ueberTod: "" } : undefined;
    d.testament = { vorsorgevollmacht: alt(v.vorsorgevollmacht), bankvollmacht: alt(v.bankvollmacht), notizen: v.notizen || "" };
    delete d.vollmachten;
    const informieren = d.sterbefall.informieren || [];
    d.kontakte = d.kontakte || [];
    for (const x of informieren) {
      const nurNummer = /^[\d\s+()\/-]+$/.test(x.kontakt || "");
      d.kontakte.push({ name: x.name || "", beziehung: x.beziehung || "", rolle: "", telefon: nurNummer ? x.kontakt : "", mobil: "", email: "", anschrift: nurNummer ? "" : (x.kontakt || ""), notiz: "" });
    }
    delete d.sterbefall.informieren;
    for (const k of d.kontakte) if (k.rolle === "betreuer") k.rolle = "sonstige";
  }
};

function istObjekt(x) {
  return x !== null && typeof x === "object" && !Array.isArray(x);
}

// Ergänzt fehlende Felder aus der Vorlage, vorhandene Werte bleiben unangetastet.
function ergaenzen(ziel, vorlage) {
  for (const key of Object.keys(vorlage)) {
    if (!(key in ziel) || ziel[key] === undefined) {
      ziel[key] = structuredClone(vorlage[key]);
    } else if (istObjekt(ziel[key]) && istObjekt(vorlage[key])) {
      ergaenzen(ziel[key], vorlage[key]);
    }
  }
  return ziel;
}

function einlesen(text) {
  let roh;
  try {
    roh = JSON.parse(text);
  } catch {
    throw new Error("Die Datei ist beschädigt oder keine Klarordner-Datei.");
  }
  if (!istObjekt(roh) || roh.format !== FORMAT || !Number.isInteger(roh.schemaVersion)) {
    throw new Error("Diese Datei ist keine Klarordner-Datei.");
  }
  if (roh.schemaVersion > SCHEMA_VERSION) {
    throw new Error("Diese Datei wurde mit einer neueren Version von Klarordner gespeichert. Bitte verwenden Sie die neueste Version.");
  }
  for (let v = roh.schemaVersion; v < SCHEMA_VERSION; v++) {
    if (!MIGRATIONEN[v]) throw new Error("Diese Dateiversion kann nicht umgewandelt werden.");
    MIGRATIONEN[v](roh);
    roh.schemaVersion = v + 1;
  }
  return ergaenzen(roh, leereDaten());
}

const $ = id => document.getElementById(id);

function el(tag, attrs = {}, ...kinder) {
  const knoten = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") knoten.textContent = v;
    else if (k.startsWith("on")) knoten.addEventListener(k.slice(2), v);
    else if (v === true) knoten.setAttribute(k, "");
    else if (v !== false && v != null) knoten.setAttribute(k, v);
  }
  for (const kind of kinder) if (kind != null) knoten.append(kind);
  return knoten;
}

// Die Eingaben bleiben automatisch auf diesem Gerät erhalten. Die Datei dient als Sicherung und zur Weitergabe.
const speicher = {
  db: null,
  async verbinden() {
    if (this.db) return this.db;
    this.db = await new Promise((ok, fehler) => {
      const anfrage = indexedDB.open("klarordner", 1);
      anfrage.onupgradeneeded = () => anfrage.result.createObjectStore("ordner");
      anfrage.onsuccess = () => ok(anfrage.result);
      anfrage.onerror = () => fehler(anfrage.error);
    });
    return this.db;
  },
  async vorgang(modus, aktion) {
    const db = await this.verbinden();
    return new Promise((ok, fehler) => {
      const tx = db.transaction("ordner", modus);
      const anfrage = aktion(tx.objectStore("ordner"));
      tx.oncomplete = () => ok(anfrage.result);
      tx.onerror = () => fehler(tx.error);
    });
  },
  lesen() { return this.vorgang("readonly", s => s.get("aktuell")); },
  schreiben(wert) { return this.vorgang("readwrite", s => s.put(wert, "aktuell")); },
  loeschen() { return this.vorgang("readwrite", s => s.delete("aktuell")); },
  videoLesen() { return this.vorgang("readonly", s => s.get("video")); },
  videoSchreiben(wert) { return this.vorgang("readwrite", s => s.put(wert, "video")); },
  videoLoeschen() { return this.vorgang("readwrite", s => s.delete("video")); },
  fotoLesen() { return this.vorgang("readonly", s => s.get("foto")); },
  fotoSchreiben(wert) { return this.vorgang("readwrite", s => s.put(wert, "foto")); },
  fotoLoeschen() { return this.vorgang("readwrite", s => s.delete("foto")); }
};

async function ersetzenOk() {
  if (!zustand.daten) return true;
  const absaetze = ["Die Daten aus der Datei ersetzen den Ordner, der gerade auf diesem Gerät gespeichert ist."];
  if (zustand.geaendert) absaetze.push("Ihr aktueller Ordner hat Änderungen, die noch nicht als Datei gesichert sind.");

    ...(zustand.geaendert ? [{ text: t("Zuerst als Datei sichern"), wert: "sichern", primaer: true }] : []),
    { text: t("Ersetzen"), wert: "ersetzen", primaer: !zustand.geaendert },
    { text: t("Abbrechen"), wert: "abbrechen" }
  ]);
  if (antwort === "ersetzen") return true;
  if (antwort === "sichern") return await sichern();
  return false;
}

async function vomGeraetLoeschen() {
  const absaetze = ["Ihr Ordner wird von diesem Gerät entfernt. Das ist sinnvoll, wenn Sie das Gerät weitergeben oder andere es mitbenutzen."];
  absaetze.push(zustand.gesichertAm
    ? t("Ihre letzte Sicherung als Datei ist vom {datum}. Danach geänderte Angaben gehen verloren.", { datum: datumText(zustand.gesichertAm) })
    : "Sie haben Ihren Ordner noch nie als Datei gesichert. Ohne Sicherung sind alle Angaben verloren.");
  if (zustand.daten && voll(zustand.daten.nachricht.video.aufgenommen)) absaetze.push("Auch die Videonachricht wird von diesem Gerät gelöscht. Gesicherte Kopien bleiben erhalten.");
  const antwort = await fragen("Von diesem Gerät löschen?", absaetze, [
    { text: t("Zuerst als Datei sichern"), wert: "sichern", primaer: true },
    { text: t("Endgültig löschen"), wert: "loeschen" },
    { text: t("Abbrechen"), wert: "abbrechen" }
  ]);
  if (antwort === "sichern") { await sichern(); return; }
  if (antwort !== "loeschen") return;
  clearTimeout(speicherTimer);
  try { await speicher.loeschen(); } catch {}
  try { await speicher.videoLoeschen(); } catch {}
  try { await speicher.fotoLoeschen(); } catch {}
  tresorVergessen();
  Object.assign(zustand, { daten: null, handle: null, dateiname: null, geaendert: false, gesichertAm: null, speichertGerade: false, zuletzt: null });
  alles();
}

async function speicherortWaehlen(name) {

async function schreibrechtOk(handle) {
  const opt = { mode: "readwrite" };
  if ((await handle.queryPermission(opt)) === "granted") return true;
  return (await handle.requestPermission(opt)) === "granted";
}

async function inHandleSchreiben(handle, text) {
  const ziel = await handle.createWritable();
  await ziel.write(text);
  await ziel.close();
}

function herunterladen(text, name) {
  const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  const a = el("a", { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function teilen(text, name) {
  const datei = new File([text], name, { type: "application/json" });

async function oeffnen() {
  if (!(await ersetzenOk())) return;

  let handle;

    if (e.name === "AbortError") return;
    await melden("Die Datei konnte nicht geöffnet werden", fehlerText(e));

  await laden(await handle.getFile(), handle);

async function laden(datei, handle) {
  let daten;
  try {
    daten = einlesen(await datei.text());
  } catch (e) {
    await melden("Die Datei konnte nicht geöffnet werden", e.message);
    return;
  }
  tresorVergessen();
  Object.assign(zustand, { daten, handle, dateiname: datei.name, geaendert: false, gesichertAm: new Date().toISOString(), ansicht: "uebersicht" });
  await imGeraetSpeichern();
  alles();
  zustand.aktualitaetGefragt = false;
  aktualitaetPruefen();
}

// kopie: neue Datei mit Datum im Namen, die bisherige Sicherung bleibt unberührt (für den USB-Stick).
async function sichern(kopie = false) {
  if (kopie !== true) kopie = false;
  if (!zustand.daten) return false;
  if (tresorTimer) await tresorSichern();
  // Jede Sicherung bekommt einen neuen IV, auch ohne Änderung seit der letzten.
  if (tresor.schluessel) {
    await tresorLauf;
    await tresorVerschluesseln(zustand.daten);
  }
  let weg = "datei";
  const heute = new Date().toISOString().slice(0, 10);
  const name = kopie ? `${t("Mein Vorsorgeordner")} ${heute}.notfall.json` : (zustand.dateiname || standardName());
  try {
    if (hatFsa && kopie) {
      const handle = await speicherortWaehlen(name);
      if (!handle) return false;
      await inHandleSchreiben(handle, alsText());
    } else if (hatFsa) {
      if (!zustand.handle) {
        const handle = await speicherortWaehlen(zustand.dateiname || standardName());
        if (!handle) return false;
        zustand.handle = handle;
      }
      if (!(await schreibrechtOk(zustand.handle))) {
        await melden("Speichern nicht erlaubt",
          "Ohne Ihre Erlaubnis kann Klarordner die Datei nicht überschreiben. Bitte klicken Sie erneut auf „Speichern“ und bestätigen Sie die Nachfrage des Browsers.");
        return false;
      }
      await inHandleSchreiben(zustand.handle, alsText());
      zustand.dateiname = zustand.handle.name;
    } else {
      weg = kannTeilen && (await teilen(alsText(), name)) ? "teilen" : "download";
      if (weg === "download") herunterladen(alsText(), name);
    }
  } catch (e) {
    if (e && e.name === "AbortError") return false;
    await melden("Speichern hat nicht geklappt", fehlerText(e),
      "Ihre Eingaben sind noch da. Bitte versuchen Sie es erneut.");
    return false;
  }
  zustand.geaendert = false;
  zustand.gesichertAm = new Date().toISOString();
  await imGeraetSpeichern();
  if (zustand.ansicht === "uebersicht") inhaltZeigen();
  if (weg === "download" && kopie) {
    await melden("Sicherungskopie gespeichert",
      t("Die Kopie liegt als „{name}“ in Ihrem Download-Ordner. Kopieren Sie sie zum Beispiel auf einen USB-Stick und bewahren Sie ihn sicher auf.", { name }));
  } else if (weg === "download" && !zustand.downloadHinweisGezeigt) {
    zustand.downloadHinweisGezeigt = true;
    await melden("Datei liegt im Download-Ordner",
      t("Ihr Ordner wurde als „{name}“ in Ihren Download-Ordner gespeichert.", { name }),
      "Bitte verschieben Sie diese Datei jetzt an den Ort Ihrer bisherigen Datei und ersetzen Sie die alte Datei damit. Sonst öffnen Sie beim nächsten Mal versehentlich den alten Stand.",
      "Steht im Dateinamen eine Zahl in Klammern, zum Beispiel „(1)“, hat der Browser die Datei umbenannt. Löschen Sie dann die alte Datei und entfernen Sie die Zahl aus dem neuen Namen.");
  }
  return true;
}

function fehlerText(e) {
  if (e && e.name === "NotAllowedError") return "Der Browser hat den Zugriff auf die Datei nicht erlaubt.";
  return t("Technische Meldung: {text}", { text: e && e.message ? e.message : String(e) });
}

/* ---------- Daten ändern ---------- */

function wurzel(pfad) {
  return pfad.startsWith("tresor.") ? [tresor.inhalt, pfad.slice(7)] : [zustand.daten, pfad];
}

function pfadLesen(pfad) {
  const [start, rest] = wurzel(pfad);
  return rest.split(".").reduce((o, k) => (o == null ? undefined : o[k]), start);
}

function pfadSchreiben(pfad, wert) {
  const [start, rest] = wurzel(pfad);
  const teile = rest.split(".");
  const letzter = teile.pop();
  const obj = teile.reduce((o, k) => o[k], start);
  obj[letzter] = wert;
  aenderung(pfad);
}

function aenderung(pfad) {
  if (pfad.startsWith("tresor.")) tresorGeaendert();
  else geaendert();
}

function geaendert() {
  zustand.daten.lastModified = new Date().toISOString();
  zustand.geaendert = true;
  speichernVormerken();
  statusZeigen();
}

/* ---------- Tresor für Zugangsdaten ---------- */

const TRESOR_RUNDEN = 600000;
const SPERRE_NACH = 10 * 60 * 1000;
const kryptoOk = !!(window.crypto && crypto.subtle);
const tresor = { schluessel: null, salt: null, runden: TRESOR_RUNDEN, inhalt: null, sperrTimer: null, aendern: false };
let tresorTimer = null;
let tresorLauf = Promise.resolve();

function zuB64(puffer) {
  const bytes = new Uint8Array(puffer);
  let text = "";
  for (let i = 0; i < bytes.length; i += 0x8000) text += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(text);
}

const ausB64 = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));

async function schluesselAbleiten(passwort, salt, runden) {
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(passwort), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: runden, hash: "SHA-256" },
    basis, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}

// Jede Verschlüsselung bekommt einen neuen IV. Salt und Rundenzahl stehen mit in der Datei.
async function tresorVerschluesseln(ziel) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const klar = new TextEncoder().encode(JSON.stringify(tresor.inhalt));
  const geheim = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, tresor.schluessel, klar);
  ziel.zugang = {
    verfahren: "AES-GCM-256", ableitung: "PBKDF2-SHA-256", runden: tresor.runden,
    salt: zuB64(tresor.salt), iv: zuB64(iv), daten: zuB64(geheim)
  };
}

async function tresorEntschluesseln(passwort) {
  const z = zustand.daten.zugang;
  const salt = ausB64(z.salt);
  const schluessel = await schluesselAbleiten(passwort, salt, z.runden);
  const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ausB64(z.iv) }, schluessel, ausB64(z.daten));
  const inhalt = JSON.parse(new TextDecoder().decode(klar));
  (inhalt.eintraege || []).forEach(e => { e.art = normWert(e.art, "zugangArt"); });
  return { schluessel, salt, runden: z.runden, inhalt };
}

function tresorGeaendert() {
  zustand.geaendert = true;
  zustand.speichertGerade = true;
  statusZeigen();
  clearTimeout(tresorTimer);
  tresorTimer = setTimeout(tresorSichern, 400);
}

function tresorSichern() {
  clearTimeout(tresorTimer);
  tresorTimer = null;
  const ziel = zustand.daten;
  if (!tresor.schluessel || !ziel) return tresorLauf;
  tresorLauf = tresorLauf.then(async () => {
    await tresorVerschluesseln(ziel);
    if (ziel === zustand.daten) geaendert();
  }).catch(() => {});
  return tresorLauf;
}

async function tresorSperren() {
  if (tresorTimer) await tresorSichern();
  else await tresorLauf;
  tresorVergessen();
  if (zustand.daten && zustand.ansicht === "zugang") inhaltZeigen();
}

// Ohne erneute Verschlüsselung, wenn der Ordner ersetzt oder gelöscht wird.
function tresorVergessen() {
  clearTimeout(tresorTimer);
  clearTimeout(tresor.sperrTimer);
  tresorTimer = null;
  Object.assign(tresor, { schluessel: null, salt: null, inhalt: null, sperrTimer: null, aendern: false });
}

function sperreVerlaengern() {
  if (!tresor.schluessel) return;
  clearTimeout(tresor.sperrTimer);
  tresor.sperrTimer = setTimeout(tresorSperren, SPERRE_NACH);
}

function fehlerZeile() {
  return el("p", { class: "fehlertext breit", role: "alert" });
}

function tresorAnlegen() {
  const eins = passwortFeld("Passwort", "Mindestens 10 Zeichen. Gut merkbar ist ein ganzer Satz, den nur Sie kennen.");
  const zwei = passwortFeld("Passwort wiederholen");
  const hakenId = neueId();
  const haken = el("input", { type: "checkbox", id: hakenId });
  const fehler = fehlerZeile();
  const knopf = el("button", { type: "submit", class: "btn primaer", text: t("Zugangsdaten schützen") });
  const formular = el("form", { class: "felder", novalidate: true },
    eins.feld, zwei.feld,
    el("div", { class: "bestaetigung breit" }, haken,
      el("label", { for: hakenId, text: t("Ich habe verstanden: Ohne dieses Passwort sind die Zugangsdaten verloren.") })),
    fehler, el("div", { class: "knopfreihe breit" }, knopf));
  formular.addEventListener("submit", async e => {
    e.preventDefault();
    const pw = eins.eingabe.value;
    fehler.textContent = "";
    if (pw.length < 10) { fehler.textContent = t("Das Passwort ist zu kurz: {n} von mindestens 10 Zeichen.", { n: pw.length }); eins.eingabe.focus(); return; }
    if (pw !== zwei.eingabe.value) { fehler.textContent = t("Die beiden Eingaben stimmen nicht überein."); zwei.eingabe.focus(); return; }
    if (!haken.checked) { fehler.textContent = t("Bitte bestätigen Sie den Hinweis zum Passwort."); haken.focus(); return; }
    knopf.disabled = true;
    knopf.textContent = t("Wird eingerichtet …");
    const salt = crypto.getRandomValues(new Uint8Array(16));
    Object.assign(tresor, { schluessel: await schluesselAbleiten(pw, salt, TRESOR_RUNDEN), salt, runden: TRESOR_RUNDEN, inhalt: { eintraege: [] } });
    await tresorVerschluesseln(zustand.daten);
    geaendert();
    sperreVerlaengern();
    inhaltZeigen();
  });
  return [
    hinweis(["Ihre Zugangsdaten werden mit einem eigenen Passwort verschlüsselt. Ohne dieses Passwort kann sie niemand öffnen, auch Sie selbst nicht. Ein vergessenes Passwort lässt sich nicht zurücksetzen.",
      "Hinterlegen Sie das Passwort deshalb sicher, zum Beispiel bei Ihrem Testament, beim Notar oder in einem versiegelten Umschlag bei einer Vertrauensperson."],
      "gelb", "Wichtig: Merken Sie sich dieses Passwort gut"),
    el("section", { class: "formkarte" },
      el("h3", { text: t("Passwort für die Zugangsdaten festlegen") }),
      el("p", { class: "kartenhilfe", text: t("Dieses Passwort gilt nur für diesen Bereich. Alle anderen Bereiche bleiben ohne Passwort lesbar, damit Ihre Angehörigen im Notfall schnell an das Wichtigste kommen.") }),
      formular)
  ];
}

function tresorOeffnen() {
  const pw = passwortFeld("Passwort für die Zugangsdaten");
  const fehler = fehlerZeile();
  const knopf = el("button", { type: "submit", class: "btn primaer", text: t("Öffnen") });
  const formular = el("form", { class: "felder", novalidate: true }, pw.feld, fehler, el("div", { class: "knopfreihe breit" }, knopf));
  formular.addEventListener("submit", async e => {
    e.preventDefault();
    fehler.textContent = "";
    knopf.disabled = true;
    knopf.textContent = t("Wird geöffnet …");
    try {
      Object.assign(tresor, await tresorEntschluesseln(pw.eingabe.value));
      sperreVerlaengern();
      inhaltZeigen();
    } catch {
      fehler.textContent = t("Das Passwort stimmt nicht. Bitte achten Sie auf Groß- und Kleinschreibung.");
      pw.eingabe.value = "";
      pw.eingabe.focus();
      knopf.disabled = false;
      knopf.textContent = t("Öffnen");
    }
  });
  return [el("section", { class: "formkarte" },
    el("h3", { text: t("Die Zugangsdaten sind gesperrt") }),
    el("p", { class: "kartenhilfe", text: t("Geben Sie das Passwort ein, das Sie für diesen Bereich festgelegt haben.") }),
    formular)];
}

function passwortAendern() {
  const alt = passwortFeld("Bisheriges Passwort");
  const neu = passwortFeld("Neues Passwort", "Mindestens 10 Zeichen.");
  const neu2 = passwortFeld("Neues Passwort wiederholen");
  const fehler = fehlerZeile();
  const knopf = el("button", { type: "submit", class: "btn primaer", text: t("Passwort ändern") });
  const formular = el("form", { class: "felder", novalidate: true }, alt.feld, neu.feld, neu2.feld, fehler,
    el("div", { class: "knopfreihe breit" }, knopf,
      el("button", { type: "button", class: "btn", text: t("Abbrechen"), onclick: () => { tresor.aendern = false; inhaltZeigen(); } })));
  formular.addEventListener("submit", async e => {
    e.preventDefault();
    fehler.textContent = "";
    const pw = neu.eingabe.value;
    if (pw.length < 10) { fehler.textContent = t("Das neue Passwort ist zu kurz: {n} von mindestens 10 Zeichen.", { n: pw.length }); return; }
    if (pw !== neu2.eingabe.value) { fehler.textContent = t("Die beiden neuen Eingaben stimmen nicht überein."); return; }
    knopf.disabled = true;
    if (tresorTimer) await tresorSichern(); else await tresorLauf;
    try {
      await tresorEntschluesseln(alt.eingabe.value);
    } catch {
      fehler.textContent = t("Das bisherige Passwort stimmt nicht.");
      knopf.disabled = false;
      return;
    }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    Object.assign(tresor, { schluessel: await schluesselAbleiten(pw, salt, TRESOR_RUNDEN), salt, runden: TRESOR_RUNDEN, aendern: false });
    await tresorVerschluesseln(zustand.daten);
    geaendert();
    inhaltZeigen();
    melden("Passwort geändert",
      "Ersetzen Sie auch das hinterlegte Passwort, zum Beispiel im Umschlag oder beim Notar.",
      "Ältere Sicherungsdateien lassen sich weiterhin nur mit dem bisherigen Passwort öffnen. Sichern Sie Ihren Ordner deshalb jetzt neu als Datei.");
  });
  return el("section", { class: "formkarte" }, el("h3", { text: t("Passwort ändern") }), formular);
}

function tresorInhalt() {
  return [
    el("section", { class: "formkarte offen" },
      el("h3", {}, symbol("schloss", "klein", "#2f7a5c"), " " + t("Geöffnet")),
      el("p", { class: "kartenhilfe", text: t("Der Bereich sperrt sich nach 10 Minuten ohne Eingabe von selbst.") }),
      el("div", { class: "knopfreihe" },
        el("button", { type: "button", class: "btn primaer", text: t("Jetzt sperren"), onclick: tresorSperren }),
        tresor.aendern ? null : el("button", { type: "button", class: "btn", text: t("Passwort ändern"), onclick: () => { tresor.aendern = true; inhaltZeigen(); } }))),
    tresor.aendern ? passwortAendern() : null,
    hinweis("Bitte tragen Sie hier keine Bank-PIN, keine TAN und keine Zugänge zum Online-Banking ein. Ihre Angehörigen bekommen mit Vollmacht oder Erbschein über die Bank Zugang zu Ihren Konten."),
    gruppe("Passwörter aus einer Datei übernehmen", "Apple Passwörter, Chrome, Edge, Firefox und viele Passwort-Manager können Ihre gespeicherten Passwörter als Datei exportieren (Endung .csv). Klarordner übernimmt sie verschlüsselt. Bankzugänge werden ausgelassen.",
      el("div", { class: "knopfreihe breit" },
        el("button", { type: "button", class: "btn", text: t("Passwort-Datei auswählen"), onclick: () => { $("csvwahl").value = ""; $("csvwahl").click(); } }))),
    zugangsListe()
  ].filter(Boolean);
}

function zugangsListe() {
  return gruppe("Ihre Zugangsdaten", "Zum Beispiel der Code für Ihr Handy, das Passwort für den Computer oder für Ihr E-Mail-Postfach.",
    liste("tresor.eintraege", {

      ]
    }));
}

/* ---------- Anzeige ---------- */

function symbol(name, groesse, farbe) {
  const s = el("span", { class: "ico " + groesse, "aria-hidden": "true" });
  if (farbe) s.style.setProperty("--farbe", farbe);
  s.innerHTML = `<svg viewBox="0 0 24 24">${SYMBOLE[name]}</svg>`;
  return s;
}

function statusZeigen() {
  const box = $("dateistatus");
  if (!zustand.daten) { box.replaceChildren(); return; }
  let pille;
  if (!zustand.geraetOk) {
    pille = zustand.geaendert
      ? el("span", { class: "pille offen", text: t("Noch nicht als Datei gesichert") })
      : el("span", { class: "pille ok", text: t("Als Datei gesichert") });
  } else if (zustand.speichertGerade || tresorTimer) {
    pille = el("span", { class: "pille", text: t("Wird gespeichert …") });
  } else {
    pille = el("span", { class: "pille ok", text: t("Auf diesem Gerät gespeichert") });
  }
  box.replaceChildren(pille);
}

function navZeigen() {
  const punkt = (id, titel, sym, farbe) => el("li", {},
    el("button", {
      type: "button",
      "aria-current": zustand.ansicht === id ? "page" : false,
      "data-id": id,
      onclick: () => wechseln(id)
    }, symbol(sym, "klein", farbe), el("span", { text: t(titel) })));
  $("navStart").replaceChildren(punkt("uebersicht", "Übersicht", "raster", "#4a6b55"));
  $("navliste").replaceChildren(...BEREICHE.map(b => punkt(b.id, b.titel, b.symbol, b.farbe)));
  $("navExtra").replaceChildren(punkt("schreiben", "Kündigungen und Schreiben", "brief", "#5b6b63"));
}

function wechseln(id) {
  if (id === "schreiben" && zustand.ansicht !== "schreiben") zustand.vonWo = zustand.ansicht;
  if (BEREICHE.some(b => b.id === id) && zustand.zuletzt !== id) {
    zustand.zuletzt = id;
    if (zustand.geraetOk && zustand.daten) speichernVormerken();
  }
  zustand.ansicht = id;
  navZeigen();
  inhaltZeigen();
  const h = $("inhalt").querySelector("h2");
  if (h) h.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function inhaltZeigen() {
  const ziel = $("inhalt");
  if (zustand.ansicht === "uebersicht") {
    ziel.replaceChildren(...uebersicht().filter(Boolean));
    return;
  }
  if (zustand.ansicht === "schreiben") {
    ziel.replaceChildren(...schreibenAnsicht());
    return;
  }
  const nr = BEREICHE.findIndex(b => b.id === zustand.ansicht);
  const b = BEREICHE[nr];
  const kinder = [
    el("button", { type: "button", class: "btn flach zurueck-oben", onclick: () => wechseln("uebersicht"), text: t("‹ Übersicht") }),
    el("div", { class: "seitenkopf" },
      symbol(b.symbol, "gross", b.farbe),
      el("div", {},
        el("h2", { tabindex: "-1", text: t(b.titel) }),
        el("p", { text: t(b.text) })))
  ];
  const form = FORMULARE[b.id];
  if (form) kinder.push(el("div", { class: "bereichinhalt" }, ...form(), ["versicherungen", "vertraege", "digital"].includes(b.id) ? kuendigungsKarte() : null));
  kinder.push(blaettern(nr));
  ziel.replaceChildren(...kinder);
}

function blaettern(nr) {
  const vor = BEREICHE[nr - 1];
  const nach = BEREICHE[nr + 1];
  return el("div", { class: "blaettern" },
    vor
      ? el("button", { type: "button", class: "btn", onclick: () => wechseln(vor.id), text: `‹ ${t(vor.titel)}` })
      : el("button", { type: "button", class: "btn", onclick: () => wechseln("uebersicht"), text: t("‹ Übersicht") }),
    nach
      ? el("button", { type: "button", class: "btn primaer", onclick: () => wechseln(nach.id), text: `${t(nach.titel)} ›` })
      : el("button", { type: "button", class: "btn primaer", onclick: () => wechseln("uebersicht"), text: t("Zur Übersicht ›") }));
}

// Je Bereich die wichtigsten Angaben. Ausgefüllt heißt: alle davon vorhanden, nicht jedes Feld.
const voll = v => typeof v === "string" ? v.trim() !== "" : !!v;
const PRUEFUNG = {
  persoenlich: d => ["vorname", "nachname", "geburtsdatum", "strasse", "ort", "familienstand", "ablagePersonalausweis"].map(f => voll(d.persoenlich[f])),
  kontakte: d => [d.kontakte.length > 0, d.kontakte.some(k => voll(k.telefon) || voll(k.mobil))],
  testament: d => [voll(d.testament.testament.vorhanden), voll(d.testament.erbvertrag.vorhanden), voll(d.testament.vorsorgevollmacht.vorhanden), voll(d.testament.bankvollmacht.vorhanden)],
  finanzen: d => [d.finanzen.konten.length > 0],
  versicherungen: d => [d.versicherungen.length > 0],
  vertraege: d => [d.vertraege.length > 0],
  wohnen: d => [voll(d.wohnen.wohnform), voll(d.wohnen.schluessel)],
  digital: d => [d.digital.konten.length > 0 || voll(d.digital.passwortManager)],
  zugang: d => tresor.inhalt ? [true, tresor.inhalt.eintraege.length > 0] : [!!d.zugang],
  sterbefall: d => [voll(d.sterbefall.bestattungsart), voll(d.sterbefall.organspende),
    voll(d.sterbefall.bestatter) || voll(d.sterbefall.grabstelle) || voll(d.sterbefall.wuensche)],
  nachricht: d => [voll(d.nachricht.text) || voll(d.nachricht.video.aufgenommen)]
};

function fortschritt(id) {
  const werte = PRUEFUNG[id](zustand.daten);
  const anteil = werte.filter(Boolean).length / werte.length;
  return { anteil, stufe: anteil === 1 ? "voll" : anteil > 0 ? "teil" : "leer" };
}

const STUFENTEXT = { voll: "Ausgefüllt", teil: "Teilweise", leer: "Noch leer" };

function ring(anteil, farbe, inhalt) {
  const umfang = 2 * Math.PI * 26;
  const box = el("span", { class: "ring", "aria-hidden": "true" });
  box.innerHTML = `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" class="spur"/><circle cx="30" cy="30" r="26" class="wert" style="stroke:${farbe};stroke-dasharray:${(anteil * umfang).toFixed(1)} ${umfang.toFixed(1)}"/></svg>`;
  if (inhalt) box.append(inhalt);
  return box;
}

function aktualitaetsKarte() {

    el("h3", { text: t("Zeit für einen Blick in Ihren Ordner") }),

    el("div", { class: "knopfreihe" },

}

// Weg zu den vorbereiteten Kündigungen, auf der Übersicht und in den Bereichen mit Verträgen.
function kuendigungsKarte() {
  const liste = schreibenListe().filter(s => !s.aus);

  return el("section", { class: "formkarte kuendigung" },

        el("h3", { text: t("Kündigungen und Schreiben") }),
        el("p", { class: "kartenhilfe", text: t("{n} Schreiben sind mit Ihren Angaben vorbereitet, davon {k} Kündigungen. Ihre Angehörigen drucken sie aus, unterschreiben und schicken sie ab.", { n: liste.length, k: kuendigungen }) }))),

      el("button", { type: "button", class: "btn primaer", text: t("Kündigungen ansehen"), onclick: () => wechseln("schreiben") })));
}

function sicherungsKarte() {
  const tage = zustand.gesichertAm ? Math.floor((Date.now() - new Date(zustand.gesichertAm)) / 864e5) : null;
  // Erinnern erst, wenn eine vorhandene Sicherung veraltet ist. Beim ersten Ausfüllen wird nicht gedrängelt.
  const dringend = zustand.geaendert && tage !== null && tage >= 30;
  const stand = zustand.gesichertAm ? t("Letzte Sicherung: {datum}", { datum: datumText(zustand.gesichertAm) }) : t("Noch nicht als Datei gesichert");
  return el("section", { class: "formkarte sicherung" + (dringend ? " dringend" : "") },
    el("h3", { text: t("Sicherung als Datei") }),
    el("p", { class: "kartenhilfe", text: t(zustand.geraetOk
      ? "Ihre Eingaben bleiben auf diesem Gerät gespeichert, Sie können jederzeit weitermachen. Wenn Sie fertig sind oder etwas Wichtiges geändert haben, sichern Sie Ihren Ordner als Datei, zum Beispiel für einen USB-Stick oder für Ihre Angehörigen."
      : "Dieser Browser kann Ihre Eingaben nicht auf dem Gerät behalten. Bitte sichern Sie Ihren Ordner als Datei, bevor Sie die App schließen.") }),
    el("p", { class: "sicherungsstand" }, el("strong", { text: stand }),
      zustand.gesichertAm && zustand.geaendert ? " · " + t("seitdem geändert") : null),
    el("div", { class: "knopfreihe" },
      el("button", { type: "button", class: "btn primaer", onclick: () => sichern(), text: t("Als Datei sichern") }),
      el("button", { type: "button", class: "btn", onclick: () => sichern(true), text: t("Sicherungskopie mit Datum") }),
      zustand.geraetOk ? el("button", { type: "button", class: "btn flach loeschen", onclick: vomGeraetLoeschen, text: t("Von diesem Gerät löschen") }) : null));
}

  const fertig = stand.filter(x => x.f.stufe === "voll").length;
  const offen = stand.filter(x => x.f.stufe !== "voll");
  const name = [d.persoenlich.vorname, d.persoenlich.nachname].filter(Boolean).join(" ");

    ? t("Mein Vorsorgeordner für {namen}", { namen: namen.length > 1 ? namen.slice(0, -1).join(", ") + " " + t("und") + " " + namen[namen.length - 1] : namen[0] })
    : t("Mein Vorsorgeordner für meine Angehörigen");

      el("div", { class: "balken", role: "progressbar", "aria-label": t("Schon geregelt"), "aria-valuemin": 0, "aria-valuemax": BEREICHE.length, "aria-valuenow": fertig },
        el("div", { style: `width: ${Math.round(fertig / BEREICHE.length * 100)}%` })),
      offen.length
        ? el("div", { class: "offenliste" }, ...offen.map(({ b }) => el("button", { type: "button", class: "offen", "data-id": b.id, onclick: () => wechseln(b.id), text: t(b.titel) })))
        : el("p", { class: "kartenhilfe", text: t("Alle Bereiche sind ausgefüllt. Schauen Sie einmal im Jahr hinein, ob noch alles stimmt.") }),
      el("div", { class: "knopfreihe" },
        el("button", { type: "button", class: "btn primaer riesig weiter", text: zustand.zuletzt ? t("Weiter, wo ich aufgehört habe") : fertig ? t("Weiter ausfüllen") : t("Mit dem Ausfüllen beginnen"), onclick: () => wechseln(ziel.id) }))),
    kuendigungsKarte(),

        el("button", { type: "button", class: "kachel", onclick: () => wechseln(b.id) },
          ring(f.anteil, b.farbe, symbol(b.symbol, "mittel", b.farbe)),
          el("span", {},
            el("span", { class: "name", text: t(b.titel) }),
            el("span", { class: "unter", text: t(b.text) }),
            el("span", { class: "stufe " + f.stufe, text: t(STUFENTEXT[f.stufe]) })))))),

  ];

/* ---------- Formular-Bausteine ---------- */

let feldZaehler = 0;
// Im Druckmodus erzeugen die Bausteine Text und Schreiblinien statt Eingabefeldern.
let druck = false;

const kasten = an => el("span", { class: "kasten", text: an ? "☒" : "☐" });

function druckWert(text, zeilen = 1) {
  if (text) return [el("span", { class: "dw", text })];
  return Array.from({ length: zeilen }, () => el("span", { class: "dw leer" }));
}

function druckFeld(pfad, beschriftung, opt) {
  const typ = opt.typ || "text";
  const roh = pfadLesen(pfad) ?? "";
  const breit = opt.breit || typ === "mehrzeilig" ? " breit" : "";
  let inhalt;
  if (typ === "auswahl") {
    const werte = OPTIONEN[opt.optionen];
    const k = normWert(roh, opt.optionen);
    const schluessel = Object.keys(werte);
    if (!k && schluessel.length <= 7) {
      inhalt = [el("span", { class: "dopt" }, ...schluessel.map(s => el("span", {}, kasten(false), t(werte[s]))))];
      return el("div", { class: "dfeld dwahl breit" }, el("span", { class: "dl", text: t(beschriftung) }), ...inhalt);
    }
    inhalt = druckWert(optText(opt.optionen, roh));
  } else if (typ === "date" || typ === "datum") {
    inhalt = druckWert(roh ? new Date(roh + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "");
  } else if (typ === "mehrzeilig") {
    inhalt = druckWert(roh, Math.min(Math.max(opt.zeilen || 3, 2), 14));
  } else {
    inhalt = druckWert(roh);
  }
  return el("div", { class: "dfeld" + breit }, el("span", { class: "dl", text: t(beschriftung) }), ...inhalt);
}
const neueId = () => "f" + (++feldZaehler);

function feld(pfad, beschriftung, opt = {}) {
  if (druck) return druckFeld(pfad, beschriftung, opt);
  const id = neueId();
  const typ = opt.typ || "text";
  const wert = pfadLesen(pfad) ?? "";
  let eingabe;
  if (typ === "mehrzeilig") {
    eingabe = el("textarea", { id, rows: opt.zeilen || 4 });
  } else if (typ === "auswahl") {
    const werte = OPTIONEN[opt.optionen];
    const aktuell = normWert(wert, opt.optionen);
    eingabe = el("select", { id },
      el("option", { value: "", text: t("Bitte wählen") }),
      ...Object.keys(werte).map(k => el("option", { value: k, text: t(werte[k]) })),
      aktuell && !(aktuell in werte) ? el("option", { value: aktuell, text: aktuell }) : null);
  } else if (typ === "datum") {
    // Für Daten weit in der Vergangenheit: Ziffern tippen statt im Kalender jahrzehntelang zurückblättern.
    eingabe = el("input", { id, type: "text", inputmode: "numeric", autocomplete: opt.autocomplete || "off", maxlength: 10, class: "datumfeld" });
  } else {
    eingabe = el("input", { id, type: typ, autocomplete: "off", inputmode: opt.eingabemodus, autocapitalize: opt.gross ? "characters" : null, list: opt.vorschlaege ? "anbieterListe" : null });
  }
  eingabe.value = typ === "auswahl" ? normWert(wert, opt.optionen) : typ === "datum" ? datumAnzeige(wert) : wert;
  const fehler = typ === "datum" ? el("p", { class: "hilfe fehler", hidden: true, text: t("Bitte als Tag, Monat und Jahr eingeben, zum Beispiel 17.03.1952.") }) : null;
  if (typ === "datum") {
    // Tippt jemand selbst Punkte, bleiben sie, sonst werden sie nach Tag und Monat eingefügt.
    let eigenePunkte = /\./.test(eingabe.value) && !/^\d{2}\.\d{2}\.\d{4}$/.test(eingabe.value);
    eingabe.addEventListener("input", e => {
      if (e.data === ".") eigenePunkte = true;
      if (!eingabe.value) eigenePunkte = false;
      let z = eingabe.value.replace(/[^\d.]/g, "");
      if (!eigenePunkte && !String(e.inputType).startsWith("delete")) {
        z = z.replace(/\D/g, "");
        const d = z.slice(0, 8);
        z = d.slice(0, 2) + (d.length > 2 ? "." + d.slice(2, 4) : "") + (d.length > 4 ? "." + d.slice(4) : "");
      }
      eingabe.value = z;
      const iso = datumLesen(z);
      if (iso || !z) { pfadSchreiben(pfad, iso || ""); fehler.hidden = true; }
    });
    eingabe.addEventListener("change", () => { fehler.hidden = !eingabe.value || !!datumLesen(eingabe.value); });
  } else eingabe.addEventListener(typ === "auswahl" ? "change" : "input", () => {
    pfadSchreiben(pfad, eingabe.value);
    if (opt.beiAenderung) opt.beiAenderung(eingabe.value);
  });
  let hilfe = null;
  if (opt.hilfe) {
    hilfe = el("p", { class: "hilfe", id: id + "h", text: t(opt.hilfe) });
    eingabe.setAttribute("aria-describedby", id + "h");
  }
  return el("div", { class: "feld" + (opt.breit || typ === "mehrzeilig" ? " breit" : "") },
    el("label", { for: id, text: t(beschriftung) }), hilfe, typ === "password" ? geheimZeile(eingabe) : eingabe, fehler);
}

// Gespeichert wird als JJJJ-MM-TT, angezeigt und getippt als TT.MM.JJJJ.
const datumAnzeige = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso || "") ? iso.split("-").reverse().join(".") : (iso || "");
function datumLesen(text) {
  const m = String(text).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (!m) return "";
  const [tag, monat, jahr] = [Number(m[1]), Number(m[2]), Number(m[3])];
  const d = new Date(Date.UTC(jahr, monat - 1, tag));
  if (d.getUTCDate() !== tag || d.getUTCMonth() !== monat - 1 || jahr < 1900 || jahr > new Date().getFullYear() + 1) return "";
  return `${jahr}-${String(monat).padStart(2, "0")}-${String(tag).padStart(2, "0")}`;
}

function geheimZeile(eingabe) {
  const knopf = el("button", { type: "button", class: "btn zeigen", "aria-pressed": "false", text: t("Anzeigen") });
  knopf.addEventListener("click", () => {
    const sichtbar = eingabe.type === "password";
    eingabe.type = sichtbar ? "text" : "password";
    knopf.textContent = t(sichtbar ? "Verbergen" : "Anzeigen");
    knopf.setAttribute("aria-pressed", String(sichtbar));
  });
  return el("div", { class: "geheimzeile" }, eingabe, knopf);
}

function passwortFeld(beschriftung, hilfe) {
  const id = neueId();
  const eingabe = el("input", { id, type: "password", autocomplete: "off", autocapitalize: "off", spellcheck: "false" });
  const teile = [el("label", { for: id, text: t(beschriftung) })];
  if (hilfe) {
    teile.push(el("p", { class: "hilfe", id: id + "h", text: t(hilfe) }));
    eingabe.setAttribute("aria-describedby", id + "h");
  }
  return { eingabe, feld: el("div", { class: "feld breit" }, ...teile, geheimZeile(eingabe)) };
}

function wahl(pfad, frage, optionen, opt = {}) {
  const name = neueId();
  const aktuell = normWert(pfadLesen(pfad) ?? "", optionen);
  const werte = OPTIONEN[optionen];
  if (druck) {
    return el("div", { class: "dfeld dwahl breit" }, el("span", { class: "dl", text: t(frage) }),
      el("span", { class: "dopt" }, ...Object.keys(werte).map(k => el("span", {}, kasten(k === aktuell), t(werte[k])))));
  }
  return el("fieldset", { class: "wahl breit" },
    el("legend", { text: t(frage) }),
    opt.hilfe ? el("p", { class: "hilfe", text: t(opt.hilfe) }) : null,
    el("div", { class: "optionen" }, ...Object.keys(werte).map(k => {
      const knopf = el("input", { type: "radio", name, value: k, checked: k === aktuell });
      knopf.addEventListener("change", () => {
        pfadSchreiben(pfad, k);
        if (opt.beiAenderung) opt.beiAenderung(k);
      });
      return el("label", {}, knopf, el("span", { text: t(werte[k]) }));
    })));
}

function gruppe(titel, hilfe, ...kinder) {
  if (druck) {
    return el("section", { class: "dgruppe" },
      el("h3", { text: t(titel) }),
      hilfe ? el("p", { class: "dhilfe", text: t(hilfe) }) : null,
      el("div", { class: "dfelder" }, ...kinder));

  return el("section", { class: "formkarte" },
    el("h3", { text: t(titel) }),
    hilfe ? el("p", { class: "kartenhilfe", text: t(hilfe) }) : null,
    el("div", { class: "felder" }, ...kinder));
}

function hinweis(text, art = "info", titel = null) {
  if (druck) {
    return el("div", { class: "dhinweis breit " + art },
      titel ? el("p", {}, el("strong", { text: t(titel) })) : null,
      ...[].concat(text).map(a => el("p", { text: t(a) })));

  return el("div", { class: "hinweis " + art + " breit" },
    titel ? el("p", {}, el("strong", { text: t(titel) })) : null,
    ...[].concat(text).map(a => el("p", { text: t(a) })));
}

// Wird ein- oder ausgeblendet, je nachdem was der Nutzer vorher gewählt hat.
function bedingt(sichtbar, ...kinder) {
  // Im Ausdruck bleiben abhängige Felder stehen, damit man sie von Hand ausfüllen kann. Reine Hinweise nur, wenn sie zutreffen.
  if (druck) {
    const nurHinweis = kinder.every(k => k && k.classList && k.classList.contains("dhinweis"));
    if (nurHinweis && !sichtbar) return null;
    return el("div", { class: "breit" }, ...kinder.map(k => (k && k.classList && k.classList.contains("felder") ? el("div", { class: "dfelder" }, ...k.childNodes) : k)));
  }
  const box = el("div", { class: "bedingt breit" }, ...kinder);
  box.hidden = !sichtbar;
  return box;
}

function liste(pfad, cfg) {
  if (druck) {
    const vorhanden = pfadLesen(pfad) || [];
    // Leere Listen bekommen zwei leere Einträge zum Ausfüllen von Hand.
    const eintraege = vorhanden.length ? vorhanden : [cfg.neu(), cfg.neu()];
    return el("div", { class: "breit" }, ...eintraege.map((e, i) => el("div", { class: "deintrag" },
      el("h4", { text: (vorhanden.length && cfg.kopf(e)) || `${t(cfg.einzahl)} ${i + 1}` }),
      el("div", { class: "dfelder" }, ...cfg.felder(`${pfad}.${i}`, e)))));
  }
  const box = el("div", { class: "liste breit" });
  const titelVon = (eintrag, i) => cfg.kopf(eintrag) || `${t(cfg.einzahl)} ${i + 1}`;

  const zeichnen = fokusNeu => {
    const eintraege = pfadLesen(pfad);
    const karten = eintraege.map((eintrag, i) => {
      const kopf = el("h4", { text: titelVon(eintrag, i) });
      const karte = el("div", { class: "eintrag" },
        el("div", { class: "eintragkopf" },
          kopf,
          el("button", {
            type: "button", class: "btn entfernen",
            "aria-label": t("{name} entfernen", { name: titelVon(eintrag, i) }),
            text: t("Entfernen"),
            onclick: async () => {
              const ok = await fragen(t("{name} entfernen?", { name: t(cfg.einzahl) }),
                [t("„{name}“ wird aus Ihrem Ordner gelöscht.", { name: titelVon(eintrag, i) })],
                [{ text: t("Entfernen"), wert: true, primaer: true }, { text: t("Abbrechen"), wert: false }]);
              if (!ok) return;
              eintraege.splice(i, 1);
              aenderung(pfad);
              zeichnen();
            }
          })),
        el("div", { class: "felder" }, ...cfg.felder(`${pfad}.${i}`, eintrag)));
      karte.addEventListener("input", () => { kopf.textContent = titelVon(eintrag, i); });
      karte.addEventListener("change", () => { kopf.textContent = titelVon(eintrag, i); });
      return karte;
    });
    box.replaceChildren(...karten,
      el("button", {
        type: "button", class: "btn hinzufuegen",
        text: t("+ {name} hinzufügen", { name: t(cfg.hinzu || cfg.einzahl) }),
        onclick: () => {
          eintraege.push(cfg.neu());
          aenderung(pfad);
          zeichnen(true);
        }
      }));
    if (fokusNeu) {
      const erstes = box.querySelector(".eintrag:last-of-type input, .eintrag:last-of-type select, .eintrag:last-of-type textarea");
      if (erstes) erstes.focus();
    }
  };
  zeichnen();
  return box;
}

function alles() {

  $("startseite").hidden = offen;
  $("arbeitsbereich").hidden = !offen;
  $("btnSpeichern").hidden = !offen;
  $("btnDrucken").hidden = !offen;
  $("btnOeffnen").hidden = !offen;
  statusZeigen();
  if (offen) {
    navZeigen();
    inhaltZeigen();
  }

  const vorteile = [

/* ---------- Aktualität ---------- */

const veraltet = () => !!(zustand.daten && zustand.daten.lastModified && Date.now() - new Date(zustand.daten.lastModified) > 365 * 864e5);

function alsAktuellMarkieren() {
  geaendert();
  if (zustand.ansicht === "uebersicht") inhaltZeigen();
}

async function aktualitaetPruefen() {
  if (zustand.aktualitaetGefragt || !veraltet()) return;
  zustand.aktualitaetGefragt = true;
  const antwort = await fragen("Zeit für einen Blick in Ihren Ordner",
    [t("Ihr Ordner wurde zuletzt am {datum} geändert, vor mehr als einem Jahr.", { datum: datumText(zustand.daten.lastModified) }),
     "Bitte prüfen Sie, ob noch alles stimmt: Ansprechpartner, Testament, Konten, Verträge und Ihre Wünsche. Dauert meist nur ein paar Minuten."],
    [{ text: "Jetzt durchsehen", wert: "durchsehen", primaer: true },
     { text: "Alles ist noch aktuell", wert: "aktuell" },
     { text: "Später", wert: "spaeter" }]);
  if (antwort === "aktuell") alsAktuellMarkieren();
  if (antwort === "durchsehen") wechseln(BEREICHE[0].id);
}

    el("p", { class: "dnotiz", text: t("Bitte benachrichtigen Sie zuerst die Ansprechpartner aus Abschnitt 2. Diese Unterlagen enthalten persönliche Daten und gehören an einen sicheren Ort.") }),
    el("p", { class: "dklein", text: t("Klarordner ersetzt keine Rechtsberatung. Vollmachten, Verfügungen und Testamente brauchen ihre eigene, teils gesetzlich vorgeschriebene Form, etwa handschriftlich oder notariell. Die Inhalte beziehen sich auf deutsches Recht.") }));
}

// Kopf- und Fußzeilen über benannte Druckseiten. Chrome und Edge zeigen sie mit Seitenzahl, andere Browser nutzen die Fußzeile im Inhalt.
function druckSeitenStil(bereiche, name) {
  const fuss = `@bottom-left { content: ${cssText(t("Stand: {datum}", { datum: datumText(zustand.daten.lastModified) }))}; font: 8.5pt sans-serif; color: #555; }
    @bottom-right { content: ${cssText(t("Seite") + " ")} counter(page) ${cssText(" " + t("von") + " ")} counter(pages); font: 8.5pt sans-serif; color: #555; }`;
  const rechts = name ? `@top-right { content: ${cssText(name)}; font: 8.5pt sans-serif; color: #555; }` : "";
  return `@media print {
  @page { ${fuss} }
  /* Kein eigener Seitentyp fürs Deckblatt: zusammen mit dem Foto zeigen manche PDF-Programme die Seite sonst nur halb. */
  ${bereiche.map(b => `@page b-${b.id} { @top-left { content: ${cssText((BEREICHE.indexOf(b) + 1) + ". " + t(b.titel))}; font: 600 9pt sans-serif; color: #333; } ${rechts} ${fuss} }
  .dbereich.b-${b.id} { page: b-${b.id}; }`).join("\n  ")}
}`;
}

function druckErzeugen(ids, mitDeckblatt) {
  const vorher = sprache;
  sprache = "de";
  druck = true;
  try {
    const bereiche = BEREICHE.filter(b => ids.includes(b.id));
    const p = zustand.daten.persoenlich;
    const name = [p.vorname, p.nachname].filter(Boolean).join(" ");
    const teile = mitDeckblatt ? [deckblatt(bereiche)] : [];
    for (const b of bereiche) {
      teile.push(el("section", { class: `dbereich b-${b.id}`, style: `--farbe: ${b.farbe}` },
        el("div", { class: "dkopf" }, el("span", { class: "punkt" }), el("h1", { text: `${BEREICHE.indexOf(b) + 1}. ${t(b.titel)}` })),
        ...FORMULARE[b.id]().filter(Boolean)));
    }
    teile.push(el("div", { class: "dfuss" },
      el("span", { text: t("Stand: {datum}", { datum: datumText(zustand.daten.lastModified) }) }),
      el("span", { text: name ? t("Vorsorgeordner von {name}", { name }) : "Klarordner" })));
    const ziel = $("druck");
    ziel.className = navigator.userAgentData ? "randboxen" : "";
    ziel.replaceChildren(...teile);
    $("druckSeiten").textContent = druckSeitenStil(bereiche, name);
  } finally {
    druck = false;
    sprache = vorher;
  }
}

// Nach dem Drucken verschwindet die Druckansicht, damit keine Passwörter in der Seite bleiben.
function druckLeeren() {
  $("druck").replaceChildren();
  $("druckSeiten").textContent = "";
}

async function druckenStarten() {
  if (!zustand.daten) return;
  if (tresorTimer) await tresorSichern();
  const offen = !!tresor.schluessel;
  const box = (id, text, an, zusatz, gesperrt) => el("label", {},
    el("input", { type: "checkbox", value: id, checked: an, disabled: gesperrt }),
    el("span", {}, text, zusatz ? el("span", { class: "zusatz", text: " " + zusatz }) : null));
  const liste = el("div", { class: "druckliste" },
    box("deckblatt", t("Deckblatt mit Inhaltsverzeichnis"), true),
    el("div", { class: "trenner", "aria-hidden": "true" }),
    ...BEREICHE.map((b, i) => box(b.id, `${i + 1}. ${t(b.titel)}`, b.id !== "zugang", b.id === "zugang" ? (offen ? t("(enthält Passwörter)") : t("(zuerst den Bereich öffnen)")) : null, b.id === "zugang" && !offen)));
  const dlg = $("dialog");
  $("dialogTitel").textContent = t("Drucken");
  $("dialogText").replaceChildren(
    el("p", { text: t("Wählen Sie, was gedruckt werden soll. Leere Bereiche werden als Formular zum Ausfüllen von Hand gedruckt.") }),
    el("p", { text: pdfTipp() }),
    sprache !== "de" ? el("p", { text: t("Der Ausdruck ist auf Deutsch, damit Ärzte, Banken und Ämter ihn lesen können.") }) : null,
    liste);
  const antwort = await new Promise(resolve => {
    $("dialogKnoepfe").replaceChildren(
      el("button", { type: "button", class: "btn primaer", text: t("Drucken"), onclick: () => { dlg.close(); resolve(true); } }),
      el("button", { type: "button", class: "btn", text: t("Abbrechen"), onclick: () => { dlg.close(); resolve(false); } }));
    dlg.onclose = () => { if (!dlg.open) resolve(false); };
    dlg.showModal();
    $("dialogKnoepfe").firstChild.focus();
  });
  if (!antwort) return;
  const gewaehlt = [...liste.querySelectorAll("input:checked")].map(i => i.value);
  const mitDeckblatt = gewaehlt.includes("deckblatt");
  let ids = gewaehlt.filter(v => v !== "deckblatt");
  if (!ids.length) {
    await melden("Nichts ausgewählt", "Bitte wählen Sie mindestens einen Bereich aus.");
    return;
  }
  if (ids.includes("zugang")) {
    const wahl = await fragen("Passwörter wirklich drucken?",
      ["Der Ausdruck enthält Ihre Passwörter und Codes im Klartext. Jeder, der das Papier in die Hand bekommt, kann sie lesen.",
       "Bewahren Sie den Ausdruck sicher auf, zum Beispiel in einem versiegelten Umschlag bei Ihren Unterlagen oder beim Notar."],
      [{ text: "Ohne Zugangsdaten drucken", wert: "ohne", primaer: true },
       { text: "Mit Zugangsdaten drucken", wert: "mit" },
       { text: "Abbrechen", wert: "abbrechen" }]);
    if (wahl === "abbrechen" || wahl === null) return;
    if (wahl === "ohne") ids = ids.filter(id => id !== "zugang");
    if (!ids.length) return;
  }
  druckErzeugen(ids, mitDeckblatt);
  window.print();
}

/* ---------- Schreiben für den Todesfall ---------- */

function pdfTipp() {
  return kannTeilen
    ? t("Als PDF speichern: Im Druckfenster oben auf Teilen tippen und „In Dateien sichern“ wählen.")
    : t("Als PDF speichern: Im Druckfenster statt eines Druckers „Als PDF speichern“ wählen.");
}

// Verträge mit Zähler: Der Brief fragt nach Zählerstand und Schlussrechnung.
const ZAEHLER = ["strom", "gas", "wasser"];

const klein = s => String(s || "").toLowerCase().replace(/&/g, "und").replace(/[^a-z0-9äöüß+.]/g, "");

// typ: "dienst" (Online-Dienste, Telefon, Rundfunk, Rente), "versicherung" oder "krankenkasse"
function anbieterFinden(text, typ) {
  const k = klein(text);
  if (!k) return null;
  const woerter = String(text).toLowerCase().split(/[^a-z0-9äöüß+]+/).filter(Boolean);
  // Kurze Kürzel wie „TK“ oder „SV“ treffen nur als ganzes Wort.
  const passt = n => { const kn = klein(n); return kn.length <= 3 ? woerter.includes(String(n).toLowerCase()) || k === kn : k.includes(kn); };
  return ANBIETER.find(a => (!typ || (a.typ || "dienst") === typ) && [a.name, ...(a.alias || [])].some(passt)) || null;
}

const anbieterVomTyp = typ => ANBIETER.filter(a => (a.typ || "dienst") === typ).sort((a, b) => a.name.localeCompare(b.name, "de"));

// Auswahl aus bekannten Versicherern oder Krankenkassen, mit freiem Feld für alle anderen.
function gesellschaftsWahl(pfad, beschriftung, typ, opt = {}) {
  if (druck) return feld(pfad, beschriftung, opt);
  const liste = anbieterVomTyp(typ);
  const wert = pfadLesen(pfad) || "";
  const treffer = anbieterFinden(wert, typ);
  const id = neueId();
  const auswahl = el("select", { id },
    el("option", { value: "", text: t("Bitte wählen") }),
    ...liste.map(a => el("option", { value: a.id, text: a.name })),
    el("option", { value: "__andere", text: t("Andere, selbst eintragen") }));
  const freiId = neueId();
  const frei = el("input", { id: freiId, type: "text", autocomplete: "off" });
  const freiFeld = el("div", { class: "feld breit" }, el("label", { for: freiId, text: t("Name der Gesellschaft") }), frei);
  const anschrift = el("p", { class: "hilfe anschrift" });
  const zeigen = () => {
    const a = anbieterFinden(pfadLesen(pfad) || "", typ);
    anschrift.textContent = a && a.adresse ? t("Anschrift für Schreiben: {adresse}", { adresse: a.adresse.split("\n").join(", ") }) : "";
    anschrift.hidden = !anschrift.textContent;
  };
  auswahl.value = treffer ? treffer.id : (wert ? "__andere" : "");
  frei.value = treffer ? "" : wert;
  freiFeld.hidden = auswahl.value !== "__andere";
  auswahl.addEventListener("change", () => {
    const a = liste.find(x => x.id === auswahl.value);
    freiFeld.hidden = auswahl.value !== "__andere";
    pfadSchreiben(pfad, a ? a.name : (auswahl.value === "__andere" ? frei.value : ""));
    if (auswahl.value === "__andere") frei.focus();
    zeigen();
    if (opt.beiAenderung) opt.beiAenderung();
  });
  frei.addEventListener("input", () => { pfadSchreiben(pfad, frei.value); zeigen(); });
  zeigen();
  return el("div", { class: "breit gesellschaft" },
    el("div", { class: "feld" }, el("label", { for: id, text: t(beschriftung) }),
      opt.hilfe ? el("p", { class: "hilfe", text: t(opt.hilfe) }) : null, auswahl, anschrift),
    freiFeld);
}

function anbieterListe() {
  let liste = $("anbieterListe");
  if (!liste) {
    liste = el("datalist", { id: "anbieterListe" });
    document.body.append(liste);
  }
  liste.replaceChildren(...anbieterVomTyp("dienst").filter(a => a.id !== "rentenservice" && a.id !== "rundfunk").map(a => el("option", { value: a.name })));
}

// Stellt aus den Angaben im Ordner zusammen, welche Schreiben nach dem Tod nötig sind.
function schreibenListe() {
  const d = zustand.daten;
  const liste = [];
  const eilig = ["leben", "sterbegeld", "unfall", "rente"];
  const sach = ["haftpflicht", "hausrat", "gebaeude", "kfz", "rechtsschutz", "unfall"];
  const rs = ANBIETER.find(a => a.id === "rentenservice");
  liste.push({ id: "rente", art: "rente", titel: "Renten Service der Deutschen Post", gruppe: "Mitteilungen", adresse: rs && rs.adresse, anbieter: rs,
    hinweis: "Wichtig für Ehe- und Lebenspartner: Den Vorschuss für das Sterbevierteljahr innerhalb von 30 Tagen beantragen. Die Anleitung wird mitgedruckt." });
  if (voll(d.persoenlich.krankenkasse.name)) {
    const kk = anbieterFinden(d.persoenlich.krankenkasse.name, "krankenkasse");
    liste.push({ id: "krankenkasse", art: "krankenkasse", titel: d.persoenlich.krankenkasse.name, gruppe: "Mitteilungen", adresse: (kk && kk.adresse) || d.persoenlich.krankenkasse.name, anbieter: kk, notiz: kk && kk.hinweis });
  }
  const banken = [...new Set(d.finanzen.konten.map(k => k.bank.trim()).filter(Boolean))];
  for (const bank of banken) {
    liste.push({ id: "bank:" + bank, art: "bank", titel: bank, gruppe: "Mitteilungen", adresse: bank, konten: d.finanzen.konten.filter(k => k.bank.trim() === bank) });
  }
  d.versicherungen.forEach((v, i) => {
    if (!voll(v.gesellschaft) && !voll(v.art)) return;
    const art = normWert(v.art, "versicherung");
    const ges = anbieterFinden(v.gesellschaft, "versicherung");
    // Sachversicherungen laufen bei vielen Gesellschaften über eine eigene Anschrift.
    const anschrift = ges && ((sach.includes(art) && ges.adresseSach) || ges.adresse);
    liste.push({ id: "vers:" + i, art: eilig.includes(art) ? "versMeldung" : "versEnde", titel: [optText("versicherung", v.art), v.gesellschaft].filter(Boolean).join(" · "), gruppe: "Mitteilungen", adresse: anschrift || v.gesellschaft, anbieter: ges, notiz: ges && ges.hinweis, vertrag: v });
  });
  if (normWert(d.wohnen.wohnform, "wohnform") === "miete" || d.vertraege.some(v => normWert(v.art, "vertrag") === "miete")) {
    liste.push({ id: "vermieter", art: "vermieter", titel: t("Vermieter"), gruppe: "Kündigungen", adresse: d.wohnen.hausverwaltung || d.wohnen.vermieter,
      hinweis: "Nur, wenn niemand in den Mietvertrag eintritt, zum Beispiel ein Ehepartner im selben Haushalt. Die Kündigung muss innerhalb eines Monats erklärt werden, nachdem Sie davon erfahren haben." });
  }
  const rf = ANBIETER.find(a => a.id === "rundfunk");
  const rfVertrag = d.vertraege.find(v => normWert(v.art, "vertrag") === "rundfunk");
  liste.push({ id: "rundfunk", art: "rundfunk", titel: t("Rundfunkbeitrag"), gruppe: "Kündigungen", adresse: rf && rf.adresse, anbieter: rf, vertrag: rfVertrag,
    hinweis: "Schneller geht es mit dem Online-Formular „Wohnung abmelden“ auf rundfunkbeitrag.de. Der Brief ist der Weg ohne Internet." });
  liste.push({ id: "vorlage", art: "leer", titel: t("Leere Kündigungsvorlage für weitere Verträge"), gruppe: "Kündigungen", adresse: "", aus: true,
    hinweis: "Für Verträge, die erst später auftauchen, zum Beispiel eine Zeitung oder eine Mitgliedschaft. Empfänger und Kundennummer werden von Hand eingetragen." });
  d.vertraege.forEach((v, i) => {
    const art = normWert(v.art, "vertrag");
    if (art === "miete" || art === "rundfunk" || (!voll(v.anbieter) && !voll(v.art))) return;
    const a = anbieterFinden(v.anbieter, "dienst");
    liste.push({ id: "vertrag:" + i, art: a && a.weg === "online" ? "anleitung" : "kuendigung", titel: [optText("vertrag", v.art), v.anbieter].filter(Boolean).join(" · "), gruppe: "Kündigungen", adresse: (a && a.adresse) || v.anbieter, anbieter: a, notiz: a && a.hinweis, vertrag: v,
      hinweis: ZAEHLER.includes(art) ? "Wohnt noch jemand in der Wohnung, kann der Vertrag auf diese Person umgeschrieben werden. Dann wird dieser Brief nicht gebraucht. Sonst den Zählerstand am Tag der Wohnungsübergabe ablesen und im Brief eintragen." : null });
  });
  d.digital.konten.forEach((k, i) => {
    if (!voll(k.anbieter)) return;
    const a = anbieterFinden(k.anbieter, "dienst");
    const wunsch = normWert(k.wunsch, "wunsch");
    const nurOnline = (a && a.weg === "online") || wunsch === "gedenken";
    liste.push({ id: "online:" + i, art: nurOnline ? "anleitung" : (wunsch === "uebertragen" ? "uebertragen" : "loeschen"), titel: k.anbieter, gruppe: "Online-Konten", adresse: (a && a.adresse) || k.anbieter, anbieter: a, konto: k });
  });
  return liste;
}

/* NUR-DEUTSCH-START: Briefe gehen an deutsche Stellen und werden nicht übersetzt. */
const LUECKE = "____________________";

function datumDe(iso) {
  return iso ? new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
}

function briefInhalt(s) {
  const d = zustand.daten;
  const p = d.persoenlich;
  const w = d.schreiben;
  const name = [p.vorname, p.nachname].filter(Boolean).join(" ") || LUECKE;
  const geb = datumDe(p.geburtsdatum) || LUECKE;
  const adresse = [p.strasse, [p.plz, p.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ") || LUECKE;
  const tod = datumDe(w.sterbedatum) || LUECKE;
  const tot = `${name}, geboren am ${geb}, zuletzt wohnhaft ${adresse}, ist am ${tod} verstorben.`;
  const ich = voll(w.beziehung) ? `Ich wende mich als ${w.beziehung.trim()} der verstorbenen Person an Sie und kümmere mich um den Nachlass.` : null;
  const bestaetigung = "Bitte bestätigen Sie mir den Eingang dieses Schreibens und die Erledigung schriftlich an die oben genannte Anschrift.";
  const nr = s.vertrag && voll(s.vertrag.vertragsnummer) ? s.vertrag.vertragsnummer.trim() : "";
  const mit = (betreff, wert) => betreff + (wert ? `, ${wert}` : "");
  switch (s.art) {
    case "rente":
      return { betreff: mit("Mitteilung über einen Sterbefall", voll(p.postrentennummer) ? `Postrentennummer ${p.postrentennummer.trim()}` : voll(p.rentenversicherungsnummer) && `Rentenversicherungsnummer ${p.rentenversicherungsnummer.trim()}`),
        absaetze: [tot, ich, "Bitte stellen Sie die Rentenzahlung ein und teilen Sie mir mit, ob noch Beträge zurückzuzahlen oder nachzuzahlen sind.",
          /ehe|witw|partner|gatt/i.test(w.beziehung || "") ? "Als hinterbliebene Ehe- oder Lebenspartnerin bzw. hinterbliebener Ehe- oder Lebenspartner beantrage ich den Vorschuss für das Sterbevierteljahr. Das Änderungsformular mit dem Original der Sterbeurkunde und meiner Bankverbindung reiche ich gesondert ein, sofern es nicht beiliegt." : null,
          bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "krankenkasse":
      return { betreff: mit("Mitteilung über einen Sterbefall", voll(d.persoenlich.krankenkasse.versichertennummer) && `Versichertennummer ${d.persoenlich.krankenkasse.versichertennummer.trim()}`),
        absaetze: [tot, ich, "Bitte beenden Sie die Mitgliedschaft zum Todestag und teilen Sie mir mit, ob Sie weitere Unterlagen benötigen. Die Gesundheitskarte der verstorbenen Person liegt bei.", bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde", "Gesundheitskarte"] };
    case "bank": {
      const ibans = s.konten.map(k => [optText("kontoart", k.kontoart), k.iban].filter(Boolean).join(" ")).filter(Boolean);
      const vollmacht = s.konten.find(k => normWert(k.vollmachtUeberTod, "jaNein") === "ja");
      return { betreff: mit("Mitteilung über einen Sterbefall", ibans.length === 1 && ibans[0]),
        absaetze: [tot, ich,
          ibans.length > 1 ? `Betroffen sind die folgenden Konten: ${ibans.join("; ")}.` : null,
          vollmacht ? `Für die Konten besteht eine Vollmacht über den Tod hinaus${voll(vollmacht.bevollmaechtigt) ? ` zugunsten von ${vollmacht.bevollmaechtigt.trim()}` : ""}.` : null,
          "Bitte teilen Sie mir den Kontostand zum Todestag mit und senden Sie mir eine Aufstellung der Daueraufträge und regelmäßigen Lastschriften. Teilen Sie mir außerdem mit, welche Unterlagen Sie für die Verfügung über die Konten und deren Auflösung benötigen.",
          bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    }
    case "versMeldung":
      return { betreff: mit("Meldung eines Todesfalls", nr && `Versicherungsnummer ${nr}`),
        absaetze: [tot, ich, `Ich melde Ihnen hiermit den Tod der versicherten Person und bitte um Auszahlung der vereinbarten Leistung an die bezugsberechtigte Person${voll(s.vertrag.beguenstigt) ? ` (${s.vertrag.beguenstigt.trim()})` : ""}.`,
          "Bitte teilen Sie mir mit, welche Unterlagen Sie für die Bearbeitung benötigen.", bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "versEnde":
      return { betreff: mit("Tod der versicherten Person", nr && `Versicherungsnummer ${nr}`),
        absaetze: [tot, ich, "Bitte teilen Sie mir mit, ob der Vertrag mit dem Tod endet. Andernfalls kündige ich ihn hiermit zum nächstmöglichen Zeitpunkt. Zu viel gezahlte Beiträge erstatten Sie bitte.", bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "vermieter":
      return { betreff: "Kündigung des Mietverhältnisses wegen Todesfalls",
        absaetze: [`${name}, geboren am ${geb}, Mieter oder Mieterin der Wohnung ${adresse}, ist am ${tod} verstorben.`, ich,
          "Als Erbe oder Erbin kündige ich das Mietverhältnis gemäß § 564 BGB außerordentlich mit der gesetzlichen Frist zum nächstmöglichen Termin.",
          "Bitte vereinbaren Sie mit mir einen Termin für die Wohnungsübergabe und teilen Sie mir mit, wie mit der Mietkaution verfahren wird.", bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "rundfunk":
      return { betreff: mit("Abmeldung wegen Todesfalls", nr && `Beitragsnummer ${nr}`),
        absaetze: [tot, ich, `Ich melde hiermit die Beitragspflicht der verstorbenen Person zum Ende des Sterbemonats ab.${nr ? "" : " Die Beitragsnummer ist mir nicht bekannt, bitte ordnen Sie das Konto anhand von Name, Geburtsdatum und Anschrift zu."} Bitte stellen Sie die Abbuchungen ein und erstatten Sie zu viel gezahlte Beiträge.`, bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "uebertragen":
      return { betreff: mit("Konto einer verstorbenen Person", voll(s.konto.benutzername) && `Konto ${s.konto.benutzername.trim()}`),
        absaetze: [tot, ich, `Die verstorbene Person hat gewünscht, dass ihr Konto${voll(s.konto.uebertragenAn) ? ` an ${s.konto.uebertragenAn.trim()}` : ""} übertragen wird. Bitte teilen Sie mir mit, ob und wie das möglich ist. Andernfalls bitte ich darum, das Konto zu schließen und die gespeicherten Daten zu löschen.`, bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "leer":
      return { betreff: `Kündigung wegen Todesfalls, Kunden- oder Vertragsnummer ${LUECKE}`,
        absaetze: [tot, ich, "Hiermit kündige ich den oben genannten Vertrag zum nächstmöglichen Zeitpunkt, hilfsweise außerordentlich wegen des Todesfalls. Bitte stellen Sie alle Abbuchungen ein und erstatten Sie zu viel gezahlte Beträge.", bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    default: {
      const vart = s.vertrag ? normWert(s.vertrag.art, "vertrag") : "";
      const erstatten = "Bitte stellen Sie alle Abbuchungen ein und erstatten Sie zu viel gezahlte Beträge.";
      const kuendigen = "Hiermit kündige ich den oben genannten Vertrag zum nächstmöglichen Zeitpunkt, hilfsweise außerordentlich wegen des Todesfalls.";
      const kunde = nr ? `Kunden- oder Vertragsnummer ${nr}` : "";
