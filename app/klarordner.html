}

// Stellt aus den Angaben im Ordner zusammen, welche Schreiben nach dem Tod nötig sind.
function schreibenListe() {
  const d = zustand.daten;
  const liste = [];
  const eilig = ["leben", "sterbegeld", "unfall", "rente"];
  const sach = ["haftpflicht", "hausrat", "gebaeude", "kfz", "rechtsschutz", "unfall"];
  const rs = ANBIETER.find(a => a.id === "rentenservice");
  liste.push({ id: "rente", art: "rente", titel: "Renten Service der Deutschen Post", gruppe: "Mitteilungen", adresse: rs && rs.adresse, anbieter: rs,
    hinweis: "Wichtig für Ehe- und Lebenspartner: Den Vorschuss für das Sterbevierteljahr innerhalb von 30 Tagen beantragen. Die Anleitung wird mitgedruckt." });
  if (voll(d.persoenlich.krankenkasse.name)) {
    const kk = anbieterFinden(d.persoenlich.krankenkasse.name, "krankenkasse");
    liste.push({ id: "krankenkasse", art: "krankenkasse", titel: d.persoenlich.krankenkasse.name, gruppe: "Mitteilungen", adresse: (kk && kk.adresse) || d.persoenlich.krankenkasse.name, anbieter: kk, notiz: kk && kk.hinweis });
  }
  const banken = [...new Set(d.finanzen.konten.map(k => k.bank.trim()).filter(Boolean))];
  for (const bank of banken) {
    liste.push({ id: "bank:" + bank, art: "bank", titel: bank, gruppe: "Mitteilungen", adresse: bank, konten: d.finanzen.konten.filter(k => k.bank.trim() === bank) });
  }
  d.versicherungen.forEach((v, i) => {
    if (!voll(v.gesellschaft) && !voll(v.art)) return;
    const art = normWert(v.art, "versicherung");
    const ges = anbieterFinden(v.gesellschaft, "versicherung");
    // Sachversicherungen laufen bei vielen Gesellschaften über eine eigene Anschrift.
    const anschrift = ges && ((sach.includes(art) && ges.adresseSach) || ges.adresse);
    liste.push({ id: "vers:" + i, art: eilig.includes(art) ? "versMeldung" : "versEnde", titel: [optText("versicherung", v.art), v.gesellschaft].filter(Boolean).join(" · "), gruppe: "Mitteilungen", adresse: anschrift || v.gesellschaft, anbieter: ges, notiz: ges && ges.hinweis, vertrag: v });
  });
  if (normWert(d.wohnen.wohnform, "wohnform") === "miete" || d.vertraege.some(v => normWert(v.art, "vertrag") === "miete")) {
    liste.push({ id: "vermieter", art: "vermieter", titel: t("Vermieter"), gruppe: "Kündigungen", adresse: d.wohnen.vermieter,
      hinweis: "Nur, wenn niemand in den Mietvertrag eintritt, zum Beispiel ein Ehepartner im selben Haushalt. Die Kündigung muss innerhalb eines Monats erklärt werden, nachdem Sie davon erfahren haben." });
  }
  const rf = ANBIETER.find(a => a.id === "rundfunk");
  const rfVertrag = d.vertraege.find(v => normWert(v.art, "vertrag") === "rundfunk");
  liste.push({ id: "rundfunk", art: "rundfunk", titel: t("Rundfunkbeitrag"), gruppe: "Kündigungen", adresse: rf && rf.adresse, anbieter: rf, vertrag: rfVertrag,
    hinweis: "Schneller geht es mit dem Online-Formular „Wohnung abmelden“ auf rundfunkbeitrag.de. Der Brief ist der Weg ohne Internet." });
  liste.push({ id: "vorlage", art: "leer", titel: t("Leere Kündigungsvorlage für weitere Verträge"), gruppe: "Kündigungen", adresse: "", aus: true,
    hinweis: "Für Verträge, die erst später auftauchen, zum Beispiel eine Zeitung oder eine Mitgliedschaft. Empfänger und Kundennummer werden von Hand eingetragen." });
  d.vertraege.forEach((v, i) => {
    const art = normWert(v.art, "vertrag");
    if (art === "miete" || art === "rundfunk" || (!voll(v.anbieter) && !voll(v.art))) return;
    const a = anbieterFinden(v.anbieter, "dienst");
    liste.push({ id: "vertrag:" + i, art: a && a.weg === "online" ? "anleitung" : "kuendigung", titel: [optText("vertrag", v.art), v.anbieter].filter(Boolean).join(" · "), gruppe: "Kündigungen", adresse: (a && a.adresse) || v.anbieter, anbieter: a, notiz: a && a.hinweis, vertrag: v,
      hinweis: ZAEHLER.includes(art) ? "Wohnt noch jemand in der Wohnung, kann der Vertrag auf diese Person umgeschrieben werden. Dann wird dieser Brief nicht gebraucht. Sonst den Zählerstand am Tag der Wohnungsübergabe ablesen und im Brief eintragen." : null });
  });
  d.digital.konten.forEach((k, i) => {
    if (!voll(k.anbieter)) return;
    const a = anbieterFinden(k.anbieter, "dienst");
    const wunsch = normWert(k.wunsch, "wunsch");
    const nurOnline = (a && a.weg === "online") || wunsch === "gedenken";
    liste.push({ id: "online:" + i, art: nurOnline ? "anleitung" : (wunsch === "uebertragen" ? "uebertragen" : "loeschen"), titel: k.anbieter, gruppe: "Online-Konten", adresse: (a && a.adresse) || k.anbieter, anbieter: a, konto: k });
  });
  return liste;
}

/* NUR-DEUTSCH-START: Briefe gehen an deutsche Stellen und werden nicht übersetzt. */
const LUECKE = "____________________";

function datumDe(iso) {
  return iso ? new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
}

function briefInhalt(s) {
  const d = zustand.daten;
  const p = d.persoenlich;
  const w = d.schreiben;
  const name = [p.vorname, p.nachname].filter(Boolean).join(" ") || LUECKE;
  const geb = datumDe(p.geburtsdatum) || LUECKE;
  const adresse = [p.strasse, [p.plz, p.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ") || LUECKE;
  const tod = datumDe(w.sterbedatum) || LUECKE;
  const tot = `${name}, geboren am ${geb}, zuletzt wohnhaft ${adresse}, ist am ${tod} verstorben.`;
  const ich = voll(w.beziehung) ? `Ich wende mich als ${w.beziehung.trim()} der verstorbenen Person an Sie und kümmere mich um den Nachlass.` : null;
  const bestaetigung = "Bitte bestätigen Sie mir den Eingang dieses Schreibens und die Erledigung schriftlich an die oben genannte Anschrift.";
  const nr = s.vertrag && voll(s.vertrag.vertragsnummer) ? s.vertrag.vertragsnummer.trim() : "";
  const mit = (betreff, wert) => betreff + (wert ? `, ${wert}` : "");
  switch (s.art) {
    case "rente":
      return { betreff: mit("Mitteilung über einen Sterbefall", voll(p.postrentennummer) ? `Postrentennummer ${p.postrentennummer.trim()}` : voll(p.rentenversicherungsnummer) && `Rentenversicherungsnummer ${p.rentenversicherungsnummer.trim()}`),
        absaetze: [tot, ich, "Bitte stellen Sie die Rentenzahlung ein und teilen Sie mir mit, ob noch Beträge zurückzuzahlen oder nachzuzahlen sind.",
          /ehe|witw|partner|gatt/i.test(w.beziehung || "") ? "Als hinterbliebene Ehe- oder Lebenspartnerin bzw. hinterbliebener Ehe- oder Lebenspartner beantrage ich den Vorschuss für das Sterbevierteljahr. Das Änderungsformular mit dem Original der Sterbeurkunde und meiner Bankverbindung reiche ich gesondert ein, sofern es nicht beiliegt." : null,
          bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "krankenkasse":
      return { betreff: mit("Mitteilung über einen Sterbefall", voll(d.persoenlich.krankenkasse.versichertennummer) && `Versichertennummer ${d.persoenlich.krankenkasse.versichertennummer.trim()}`),
        absaetze: [tot, ich, "Bitte beenden Sie die Mitgliedschaft zum Todestag und teilen Sie mir mit, ob Sie weitere Unterlagen benötigen. Die Gesundheitskarte der verstorbenen Person liegt bei.", bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde", "Gesundheitskarte"] };
    case "bank": {
      const ibans = s.konten.map(k => [optText("kontoart", k.kontoart), k.iban].filter(Boolean).join(" ")).filter(Boolean);
      const vollmacht = s.konten.find(k => normWert(k.vollmachtUeberTod, "jaNein") === "ja");
      return { betreff: mit("Mitteilung über einen Sterbefall", ibans.length === 1 && ibans[0]),
        absaetze: [tot, ich,
          ibans.length > 1 ? `Betroffen sind die folgenden Konten: ${ibans.join("; ")}.` : null,
          vollmacht ? `Für die Konten besteht eine Vollmacht über den Tod hinaus${voll(vollmacht.bevollmaechtigt) ? ` zugunsten von ${vollmacht.bevollmaechtigt.trim()}` : ""}.` : null,
          "Bitte teilen Sie mir den Kontostand zum Todestag mit und senden Sie mir eine Aufstellung der Daueraufträge und regelmäßigen Lastschriften. Teilen Sie mir außerdem mit, welche Unterlagen Sie für die Verfügung über die Konten und deren Auflösung benötigen.",
          bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    }
    case "versMeldung":
      return { betreff: mit("Meldung eines Todesfalls", nr && `Versicherungsnummer ${nr}`),
        absaetze: [tot, ich, `Ich melde Ihnen hiermit den Tod der versicherten Person und bitte um Auszahlung der vereinbarten Leistung an die bezugsberechtigte Person${voll(s.vertrag.beguenstigt) ? ` (${s.vertrag.beguenstigt.trim()})` : ""}.`,
          "Bitte teilen Sie mir mit, welche Unterlagen Sie für die Bearbeitung benötigen.", bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "versEnde":
      return { betreff: mit("Tod der versicherten Person", nr && `Versicherungsnummer ${nr}`),
        absaetze: [tot, ich, "Bitte teilen Sie mir mit, ob der Vertrag mit dem Tod endet. Andernfalls kündige ich ihn hiermit zum nächstmöglichen Zeitpunkt. Zu viel gezahlte Beiträge erstatten Sie bitte.", bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "vermieter":
      return { betreff: "Kündigung des Mietverhältnisses wegen Todesfalls",
        absaetze: [`${name}, geboren am ${geb}, Mieter oder Mieterin der Wohnung ${adresse}, ist am ${tod} verstorben.`, ich,
          "Als Erbe oder Erbin kündige ich das Mietverhältnis gemäß § 564 BGB außerordentlich mit der gesetzlichen Frist zum nächstmöglichen Termin.",
          "Bitte vereinbaren Sie mit mir einen Termin für die Wohnungsübergabe und teilen Sie mir mit, wie mit der Mietkaution verfahren wird.", bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "rundfunk":
      return { betreff: mit("Abmeldung wegen Todesfalls", nr && `Beitragsnummer ${nr}`),
        absaetze: [tot, ich, `Ich melde hiermit die Beitragspflicht der verstorbenen Person zum Ende des Sterbemonats ab.${nr ? "" : " Die Beitragsnummer ist mir nicht bekannt, bitte ordnen Sie das Konto anhand von Name, Geburtsdatum und Anschrift zu."} Bitte stellen Sie die Abbuchungen ein und erstatten Sie zu viel gezahlte Beiträge.`, bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "uebertragen":
      return { betreff: mit("Konto einer verstorbenen Person", voll(s.konto.benutzername) && `Konto ${s.konto.benutzername.trim()}`),
        absaetze: [tot, ich, `Die verstorbene Person hat gewünscht, dass ihr Konto${voll(s.konto.uebertragenAn) ? ` an ${s.konto.uebertragenAn.trim()}` : ""} übertragen wird. Bitte teilen Sie mir mit, ob und wie das möglich ist. Andernfalls bitte ich darum, das Konto zu schließen und die gespeicherten Daten zu löschen.`, bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    case "leer":
      return { betreff: `Kündigung wegen Todesfalls, Kunden- oder Vertragsnummer ${LUECKE}`,
        absaetze: [tot, ich, "Hiermit kündige ich den oben genannten Vertrag zum nächstmöglichen Zeitpunkt, hilfsweise außerordentlich wegen des Todesfalls. Bitte stellen Sie alle Abbuchungen ein und erstatten Sie zu viel gezahlte Beträge.", bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    default: {
      const vart = s.vertrag ? normWert(s.vertrag.art, "vertrag") : "";
      const erstatten = "Bitte stellen Sie alle Abbuchungen ein und erstatten Sie zu viel gezahlte Beträge.";
      const kuendigen = "Hiermit kündige ich den oben genannten Vertrag zum nächstmöglichen Zeitpunkt, hilfsweise außerordentlich wegen des Todesfalls.";
      const kunde = nr ? `Kunden- oder Vertragsnummer ${nr}` : "";
      if (ZAEHLER.includes(vart)) {
        const zaehler = voll(s.vertrag.zaehler) ? s.vertrag.zaehler.trim() : LUECKE;
        return { betreff: mit(vart === "wasser" ? "Abmeldung wegen Todesfalls" : "Kündigung des Liefervertrags wegen Todesfalls", kunde),
          absaetze: [tot, ich,
            `Hiermit kündige ich den Vertrag für die Abnahmestelle ${adresse} zum nächstmöglichen Zeitpunkt, hilfsweise außerordentlich wegen des Todesfalls.`,
            `Zählernummer: ${zaehler}`,
            `Zählerstand: ${"_".repeat(14)} abgelesen am ${"_".repeat(12)}`,
            "Bitte erstellen Sie die Schlussrechnung auf Grundlage dieses Zählerstands und senden Sie sie an mich. Ein Guthaben erstatten Sie bitte nach Rücksprache mit mir.", bestaetigung],
          anlagen: ["Kopie der Sterbeurkunde"] };
      }
      if (vart === "zeitung") {
        return { betreff: mit("Kündigung des Abonnements wegen Todesfalls", kunde),
          absaetze: [tot, ich, "Hiermit kündige ich das Abonnement zum nächstmöglichen Zeitpunkt, hilfsweise außerordentlich wegen des Todesfalls. Bitte stellen Sie die Lieferung sofort ein und erstatten Sie im Voraus gezahlte Beträge anteilig.", bestaetigung],
          anlagen: ["Kopie der Sterbeurkunde"] };
      }
      if (vart === "verein") {
        return { betreff: mit("Ende der Mitgliedschaft wegen Todesfalls", nr && `Mitgliedsnummer ${nr}`),
          absaetze: [tot, ich, "Die Mitgliedschaft endet mit dem Tod, sofern Ihre Satzung nichts anderes bestimmt. Bitte tragen Sie die verstorbene Person zum Todestag aus und ziehen Sie keine Beiträge mehr ein. Im Voraus gezahlte Beiträge erstatten Sie bitte, soweit Ihre Satzung das vorsieht.",
            "Sollte die Mitgliedschaft nach Ihrer Satzung nicht von selbst enden, kündige ich sie hiermit zum nächstmöglichen Zeitpunkt.", bestaetigung],
          anlagen: ["Kopie der Sterbeurkunde"] };
      }
      if (vart === "fitness") {
        return { betreff: mit("Kündigung der Mitgliedschaft wegen Todesfalls", nr && `Mitgliedsnummer ${nr}`),
          absaetze: [tot, ich, "Das Mitglied kann die vereinbarten Leistungen nicht mehr in Anspruch nehmen. Ich kündige den Vertrag deshalb außerordentlich aus wichtigem Grund nach § 314 BGB mit sofortiger Wirkung, hilfsweise zum nächstmöglichen Zeitpunkt.", erstatten, bestaetigung],
          anlagen: ["Kopie der Sterbeurkunde"] };
      }
      if (vart === "telefon" || vart === "handy") {
        return { betreff: mit("Kündigung wegen Todesfalls", kunde),
          absaetze: [tot, ich, kuendigen, "Bitte schalten Sie die Rufnummer ab und teilen Sie mir mit, ob geliehene Geräte wie ein Router zurückgeschickt werden müssen.", erstatten, bestaetigung],
          anlagen: ["Kopie der Sterbeurkunde"] };
      }
      const konto = s.konto && voll(s.konto.benutzername) ? `Konto ${s.konto.benutzername.trim()}` : kunde;
      return { betreff: mit("Kündigung wegen Todesfalls", konto),
        absaetze: [tot, ich, "Hiermit kündige ich den oben genannten Vertrag zum nächstmöglichen Zeitpunkt, hilfsweise außerordentlich wegen des Todesfalls. Bitte stellen Sie alle Abbuchungen ein und erstatten Sie zu viel gezahlte Beträge.",
          s.konto ? "Bitte schließen Sie das Kundenkonto und löschen Sie alle dazu gespeicherten Daten." : null, bestaetigung],
        anlagen: ["Kopie der Sterbeurkunde"] };
    }
  }
}

// E-Mail-Adresse für ein Schreiben: vom Nutzer beim Vertrag notiert oder beim Anbieter hinterlegt.
function mailAdresse(s) {
  const eigene = (zustand.daten.schreiben.email || {})[s.id];
  if (eigene && eigene.trim()) return eigene.trim();
  const notiert = [s.vertrag && s.vertrag.kuendigung, s.vertrag && s.vertrag.notiz, s.konto && s.konto.notiz].filter(Boolean).join(" ").match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/);
  if (notiert) return notiert[0];
  return s.art !== "leer" && s.anbieter && s.anbieter.email ? s.anbieter.email : "";
}

async function angabenVollstaendig() {
  const w = zustand.daten.schreiben;
  if (voll(w.absender) && voll(w.anschrift) && voll(w.sterbedatum)) return true;
  return await fragen("Es fehlen noch Angaben", ["Bitte tragen Sie oben unter „Absender“ zuerst Ihren Namen, Ihre Anschrift und das Sterbedatum ein. Sonst fehlen diese Angaben im Schreiben."],
    [{ text: t("Angaben eintragen"), wert: false, primaer: true }, { text: t("Trotzdem öffnen"), wert: true }]);
}

async function mailOeffnen(s, adresse) {
  if (!(await angabenVollstaendig())) { $("inhalt").querySelector(".formkarte input")?.focus(); return; }
  const weiter = await fragen("E-Mail öffnen", [adresse ? t("Gleich öffnet sich Ihre Mail-App mit dem fertigen Text an {adresse}.", { adresse })
      : t("Gleich öffnet sich Ihre Mail-App mit dem fertigen Text. Die E-Mail-Adresse des Empfängers tragen Sie dort oben bei „An“ ein. Sie steht meist auf der Webseite des Anbieters unter Kontakt."),
    "Hängen Sie dort noch ein Foto oder eine Kopie der Sterbeurkunde an. Dann tippen Sie auf „Senden“."],
    [{ text: t("Mail-App öffnen"), wert: true, primaer: true }, { text: t("Abbrechen"), wert: false }]);
  if (!weiter) return;
  const m = mailText(s);
  const a = el("a", { href: `mailto:${adresse}?subject=${encodeURIComponent(m.betreff)}&body=${encodeURIComponent(m.text)}` });
  document.body.append(a);
  a.click();
  a.remove();
}

async function briefOeffnen(s) {
  if (!(await angabenVollstaendig())) { $("inhalt").querySelector(".formkarte input")?.focus(); return; }

function briefeDrucken(auswahl) {
  const ziel = $("druck");
  ziel.className = "";
  // Briefe gehen an deutsche Stellen, auch Auswahlwerte wie die Kontoart erscheinen auf Deutsch.
  const vorher = sprache;
  sprache = "de";
  try {
    // Bei Anbietern mit beschriebenem Verfahren folgt dem Brief eine Anleitung für die Angehörigen.
    ziel.replaceChildren(...auswahl.flatMap(s => s.art === "anleitung" ? [anleitungSeite(s)]
      : (s.anbieter && s.anbieter.schritte && s.anbieter.schritte.length ? [briefSeite(s), anleitungSeite(s)] : [briefSeite(s)])));
  } finally {
    sprache = vorher;
  }
  $("druckSeiten").textContent = "@media print { @page brief { margin: 18mm 20mm 18mm 25mm; } .dbrief { page: brief; } }";
  window.print();
}

// vCard 2.1 bis 4.0: gefaltete Zeilen, Quoted-Printable, maskierte Zeichen.
function vcardLesen(text) {
  const zeilen = text.replace(/\r\n/g, "\n").replace(/=\n/g, "=\u0000").replace(/\n[ \t]/g, "").split("\n").map(z => z.replace(/=\u0000/g, "=\n"));
  const karten = [];
  let k = null;
  const qp = s => {
    const bytes = [];
    s = s.replace(/=\n[ \t]?/g, "");
    for (let i = 0; i < s.length; i++) {
      if (s[i] === "=" && /^[0-9A-F]{2}$/i.test(s.substr(i + 1, 2))) { bytes.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
      else bytes.push(s.charCodeAt(i));
    }
    return new TextDecoder().decode(new Uint8Array(bytes));
  };
  const unmask = s => s.replace(/\\n/gi, "\n").replace(/\\([,;\\])/g, "$1");
  for (const roh of zeilen) {
    const zeile = roh.trim();
    if (/^BEGIN:VCARD/i.test(zeile)) { k = { tel: [], mobil: [], email: [], adr: "", fn: "", n: "" }; continue; }
    if (/^END:VCARD/i.test(zeile)) { if (k) karten.push(k); k = null; continue; }
    if (!k) continue;
    const pos = zeile.indexOf(":");
    if (pos < 0) continue;
    const kopf = zeile.slice(0, pos).toUpperCase();
    let wert = zeile.slice(pos + 1);
    if (kopf.includes("QUOTED-PRINTABLE")) wert = qp(wert);
    const name = kopf.split(";")[0].replace(/^ITEM\d+\./, "");
    if (name === "FN") k.fn = unmask(wert).trim();
    else if (name === "N") k.n = wert.split(";").slice(0, 2).reverse().map(unmask).filter(Boolean).join(" ").trim();
    else if (name === "TEL") (/CELL|MOBILE|IPHONE/.test(kopf) ? k.mobil : k.tel).push(wert.replace(/^tel:/i, "").trim());
    else if (name === "EMAIL") k.email.push(wert.trim());
    else if (name === "ADR" && !k.adr) {
      const t3 = wert.split(";").map(unmask);
      k.adr = [t3[2], [t3[5], t3[3]].filter(Boolean).join(" ")].map(s => (s || "").replace(/\n/g, ", ").trim()).filter(Boolean).join(", ");
    }
  }
  return karten.map(k => ({ name: k.fn || k.n, beziehung: "", rolle: "", telefon: k.tel[0] || "", mobil: k.mobil[0] || (k.tel[1] || ""), email: k.email[0] || "", anschrift: k.adr, notiz: "" }))
    .filter(k => k.name || k.telefon || k.mobil);
}

// Eine verkleinerte Fassung liegt im Ordner und damit in der Sicherungsdatei. Das Original bleibt auf dem Gerät,
// zum Beispiel für die Traueranzeige, und gehört über seine Kennung zu genau diesem Ordner.
const PERSON_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c0-4.2 3.4-6.5 7.5-6.5s7.5 2.3 7.5 6.5"/></svg>';

async function fotoVerkleinern(datei, max = 1000) {
  const bild = await createImageBitmap(datei);
  const f = Math.min(1, max / Math.max(bild.width, bild.height));
  const c = el("canvas");
  c.width = Math.round(bild.width * f);
  c.height = Math.round(bild.height * f);
  c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
  bild.close();
  return c.toDataURL("image/jpeg", 0.85);
}

function datenAdresseZuBlob(adresse) {
  const [kopf, inhalt] = adresse.split(",");
  const bytes = Uint8Array.from(atob(inhalt), z => z.charCodeAt(0));
  return new Blob([bytes], { type: kopf.slice(5, kopf.indexOf(";")) });
}

async function fotoSichern() {
  const p = zustand.daten.persoenlich;

  const blob = original && original.id === p.fotoId ? original.blob : datenAdresseZuBlob(p.foto);
  const endung = /png/.test(blob.type) ? "png" : /heic|heif/.test(blob.type) ? "heic" : "jpg";
  const datei = new File([blob], `${t("Mein Foto")}.${endung}`, { type: blob.type || "image/jpeg" });
  try {
    if (kannTeilen && navigator.canShare({ files: [datei] })) {
      await navigator.share({ files: [datei] });
    } else {
      const url = URL.createObjectURL(datei);
      const a = el("a", { href: url, download: datei.name });
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
  } catch (e) {
    if (e && e.name !== "AbortError") melden("Speichern hat nicht geklappt", fehlerText(e));

}

// Die Texterkennung läuft auf dem Gerät. Das Foto wird nur gelesen und weder gespeichert noch weitergegeben.
const scanMoeglich = () => location.protocol !== "file:" && "Worker" in window && typeof WebAssembly === "object";
let ocrArbeiter = null;
let ocrMelden = () => {};

function skriptLaden(src) {
  return new Promise((ok, fehler) => { const s = el("script", { src }); s.onload = ok; s.onerror = fehler; document.head.append(s); });
}

async function texterkennung() {
  if (ocrArbeiter) return ocrArbeiter;
  const basis = new URL("ocr/", location.href).href;
  if (!window.Tesseract) await skriptLaden(basis + "tesseract.min.js");
  ocrArbeiter = await Tesseract.createWorker("deu", 1, {
    workerPath: basis + "worker.min.js", corePath: basis, langPath: basis,
    workerBlobURL: false, cacheMethod: "none", gzip: true,
    logger: m => ocrMelden(m)
  });
  return ocrArbeiter;
}

// Verkleinert große Kamerafotos, das macht die Erkennung schneller und kaum schlechter.
async function bildVorbereiten(datei) {
  const bild = await createImageBitmap(datei);
  const f = Math.min(1, 2400 / Math.max(bild.width, bild.height));
  const c = el("canvas");
  c.width = Math.round(bild.width * f);
  c.height = Math.round(bild.height * f);
  c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
  bild.close();
  return c;
}

const ibanGueltig = iban => {
  const z = (iban.slice(4) + iban.slice(0, 4)).replace(/[A-Z]/g, b => b.charCodeAt(0) - 55);
  let rest = 0;
  for (const ziffer of z) rest = (rest * 10 + Number(ziffer)) % 97;
  return rest === 1;
};

// Sucht im erkannten Text nach den Angaben, die Klarordner braucht. Alles Gefundene wird vor dem Übernehmen angezeigt.
function dokumentAuswerten(roh) {
  const text = roh.replace(/[|]/g, " ").replace(/[ \t]+/g, " ");
  const zeilen = text.split("\n").map(z => z.trim()).filter(Boolean);
  const nachMarke = marke => {
    for (let i = 0; i < zeilen.length; i++) {
      const m = zeilen[i].match(marke);
      if (!m) continue;
      let rest = zeilen[i].slice(m.index + m[0].length).replace(/^[\s:.#-]+/, "");
      if (!/\d/.test(rest) && zeilen[i + 1]) rest = zeilen[i + 1];
      const teile = [];
      for (const w of rest.split(" ")) {
        if (/\d/.test(w) || (!teile.length && /^[A-Z]{1,4}$/.test(w))) teile.push(w.replace(/[,;]$/, ""));
        else break;
      }
      const wert = teile.join(" ");
      if (/\d/.test(wert) && wert.replace(/\W/g, "").length >= 4) return wert;
    }
    return "";
  };
  const finde = paare => (paare.find(([muster]) => muster.test(text)) || [])[1] || "";
  const erg = {};
  const rv = text.match(/\b(\d{2}) ?(\d{6}) ?([A-Z]) ?(\d{3})\b/);
  if (rv) erg.rentenversicherungsnummer = `${rv[1]} ${rv[2]} ${rv[3]} ${rv[4]}`;
  erg.versicherungsnummer = nachMarke(/(versicherungs(schein)?[\s-]*(nummer|nr\.?)|vers\.?[\s-]*nr\.?|polic[ey]n?[\s-]*(nummer|nr\.?)|vertrags[\s-]*(nummer|nr\.?))/i);
  if (rv && erg.versicherungsnummer.replace(/\W/g, "") === erg.rentenversicherungsnummer.replace(/\W/g, "")) erg.versicherungsnummer = "";
  erg.kundennummer = nachMarke(/(kunden|vertrags|mitglieds|abo(nnement)?s?)[\s-]*(nummer|nr\.?)/i) || erg.versicherungsnummer;
  erg.zaehler = nachMarke(/z[äa]hler[\s-]*(nummer|nr\.?)/i);
  const vn = nachMarke(/versicherten[\s-]*(nummer|nr\.?)/i).replace(/\s/g, "");
  erg.versichertennummer = /^[A-Z]\d{9}$/.test(vn) ? vn : ((text.match(/\b[A-Z]\d{9}\b/) || [])[0] || vn);
  const st = text.match(/(steuer[\s-]*(liche[\s-]*)?id(entifikationsnummer)?|identifikationsnummer|idnr)[^\d]{0,30}((\d ?){11})/i);
  if (st) erg.steuerId = st[4].replace(/\D/g, "").replace(/^(\d{2})(\d{3})(\d{3})(\d{3})$/, "$1 $2 $3 $4");
  for (const m of text.toUpperCase().matchAll(/\bD[EF] ?\d{2}(?: ?[0-9O]{4}){4} ?[0-9O]{2}\b/g)) {
    const iban = m[0].replace(/ /g, "").replace(/^DF/, "DE").replace(/O/g, "0");
    if (ibanGueltig(iban)) { erg.iban = iban.replace(/(.{4})/g, "$1 ").trim(); break; }
  }
  erg.bank = ((text.match(/(Sparkasse[^\n,]{0,30}|Volksbank[^\n,]{0,30}|Raiffeisenbank[^\n,]{0,30}|Sparda-Bank[^\n,]{0,20}|PSD Bank[^\n,]{0,20}|Postbank|Commerzbank|Deutsche Bank|Consorsbank|comdirect|Targobank|HypoVereinsbank|Santander|\bING\b|\bDKB\b|\bN26\b)/i) || [])[0] || "").trim();
  // Absender aus dem Briefkopf, falls der Anbieter nicht in der Liste steht.
  erg.absender = (zeilen.slice(0, 8).find(z => /(GmbH|\bAG\b|\bSE\b|e\. ?V\.|\bKG\b|\bVVaG\b|\ba\. ?G\.|Stadtwerke|Versicherung|Verlag|Verein|Sparkasse|Bank)/.test(z) && (z.match(/\d/g) || []).length < 3) || "").replace(/[^\wäöüÄÖÜß&.,+ -]/g, "").trim();
  erg.kontoart = finde([[/girokonto/i, "giro"], [/tagesgeld/i, "tagesgeld"], [/festgeld/i, "festgeld"], [/sparkonto|sparbuch|spareinlage/i, "spar"], [/depot/i, "depot"], [/bauspar/i, "bauspar"], [/kreditkarte/i, "kreditkarte"], [/darlehen|kredit/i, "kredit"]]);
  erg.gesellschaft = anbieterFinden(text, "versicherung");
  erg.kasse = anbieterFinden(text, "krankenkasse");
  erg.dienst = anbieterFinden(text, "dienst");
  erg.versArt = finde([[/sterbegeld/i, "sterbegeld"], [/risikoleben|lebensversicherung/i, "leben"], [/berufsunf[äa]hig/i, "bu"], [/unfallversicherung/i, "unfall"],
    [/pflege(zusatz|tagegeld|renten)/i, "pflege"], [/kranken(zusatz)?versicherung|zahnzusatz/i, "kranken"], [/rechtsschutz/i, "rechtsschutz"], [/wohngeb[äa]ude/i, "gebaeude"],
    [/hausrat/i, "hausrat"], [/haftpflicht/i, "haftpflicht"], [/kraftfahrt|kfz|fahrzeug/i, "kfz"], [/private? rente|rentenversicherung/i, "rente"]]);
  erg.vertragArt = finde([[/erdgas|\bgas(liefer|vertrag|tarif)/i, "gas"], [/strom/i, "strom"], [/trinkwasser|wasserversorgung/i, "wasser"], [/mobilfunk|handy|sim-karte/i, "handy"],
    [/dsl|glasfaser|internet|festnetz|telefon/i, "telefon"], [/abonnement|zeitung|zeitschrift|leserservice/i, "zeitung"], [/fitness|studio/i, "fitness"], [/verein|beitrittserkl|mitgliedsbeitrag/i, "verein"]]);
  return erg;
}

    feldEl.value = f.wert || "";
    return { f, feldEl, box: el("div", { class: "feld" }, el("label", { for: id, text: t(f.label) }), feldEl) };
  });
  const roh = el("textarea", { rows: 6, readonly: true });
  roh.value = text.trim();
  $("dialogTitel").textContent = t("Gefundene Angaben prüfen");
  $("dialogText").replaceChildren(
    el("p", { text: t("Bitte vergleichen Sie die Angaben mit dem Dokument und korrigieren Sie sie bei Bedarf. Leere Felder können Sie später ergänzen.") }),
    el("div", { class: "scanfelder" }, ...eingaben.map(e => e.box)),
    el("details", {}, el("summary", { text: t("Erkannten Text ansehen") }), roh));
  return new Promise(resolve => {
    $("dialogKnoepfe").replaceChildren(
      el("button", { type: "button", class: "btn", text: t("Abbrechen"), onclick: () => { dlg.close(); resolve(null); } }),
      el("button", { type: "button", class: "btn primaer", text: t("Übernehmen"), onclick: () => {
        dlg.close();
        resolve(Object.fromEntries(eingaben.map(e => [e.f.name, e.feldEl.value])));
      } }));
    dlg.onclose = () => { if (!dlg.open) resolve(null); };
    dlg.showModal();
  });
}

async function dokumentScannen(datei, bereich) {
  const ziel = SCAN_ZIELE[bereich];
  const schliessen = scanFortschritt();
  let text = "";
  try {
    const bild = await bildVorbereiten(datei);
    const arbeiter = await texterkennung();
    text = (await arbeiter.recognize(bild)).data.text || "";
  } catch {
    schliessen();
    melden("Das Dokument konnte nicht gelesen werden", "Bitte versuchen Sie es noch einmal. Beim ersten Mal braucht Klarordner dafür eine Internetverbindung, danach nicht mehr.");
    return;
  }
  schliessen();
  const felder = ziel.felder({ ...dokumentAuswerten(text), text });
  if (!felder.some(f => voll(f.wert))) {
    melden("Keine passenden Angaben gefunden", "Fotografieren Sie die Seite mit der Nummer möglichst gerade, bei gutem Licht und ohne Schatten. Die ganze Seite sollte zu sehen sein.");
    return;
  }
  const werte = await scanVorschlag(felder, text);
  if (!werte || !Object.values(werte).some(voll)) return;
  ziel.uebernehmen(werte);
  geaendert();
  inhaltZeigen();
}

async function kontakteImportieren(datei) {

}

// CSV nach RFC 4180: Anführungszeichen, verdoppelte Anführungszeichen, Zeilenumbrüche im Feld.
function csvLesen(text) {
  text = text.replace(/^\uFEFF/, "");
  const trenner = (text.split("\n")[0].match(/;/g) || []).length > (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  const zeilen = [];
  let feld = "", zeile = [], inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i + 1] === '"') { feld += '"'; i++; }
      else if (c === '"') inQ = false;
      else feld += c;
    } else if (c === '"') inQ = true;
    else if (c === trenner) { zeile.push(feld); feld = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      zeile.push(feld); feld = "";
      if (zeile.some(f => f !== "")) zeilen.push(zeile);
      zeile = [];
    } else feld += c;
  }
  zeile.push(feld);
  if (zeile.some(f => f !== "")) zeilen.push(zeile);
  return zeilen;
}

const BANKEN = ["sparkasse", "volksbank", "raiffeisen", "commerzbank", "deutsche-bank", "db.com", "postbank", "comdirect", "consorsbank", "dkb", "ing.de", "ing-diba", "n26", "hypovereinsbank", "santander", "targobank", "sparda", "psd-", "norisbank", "1822direkt", "c24", "tomorrow.one", "bunq", "gls-bank", "triodos", "apobank", "onlinebanking", "banking"];
const ONLINE_ART = [[/mail|gmx|web\.de|t-online|outlook|hotmail|yahoo|freenet|posteo|mailbox|icloud/, "email"], [/paypal|klarna/, "bezahl"],
  [/facebook|instagram|twitter|x\.com|linkedin|xing|tiktok|pinterest|stayfriends/, "sozial"], [/whatsapp|telegram|signal|threema|skype/, "messenger"],
  [/netflix|spotify|disney|dazn|sky|rtl|joyn|youtube|audible|deezer|primevideo/, "streaming"], [/dropbox|onedrive|drive\.google|magentacloud|cloud/, "cloud"],
  [/amazon|ebay|otto|zalando|kleinanzeigen|lidl|aldi|tchibo|ikea|mediamarkt|saturn|temu|shein|aliexpress/, "shop"]];

function hostVon(u) {
  try { return new URL(/^[a-z]+:\/\//i.test(u) ? u : "https://" + u).hostname.replace(/^www\./, ""); } catch { return ""; }
}

function passwoerterLesen(text) {
  const zeilen = csvLesen(text);
  if (zeilen.length < 2) return null;
  const kopf = zeilen[0].map(s => s.trim().toLowerCase());
  const spalte = (...namen) => kopf.findIndex(k => namen.includes(k));
  const iUrl = spalte("url", "login_uri", "website", "web site", "adresse", "origin_url");
  const iUser = spalte("username", "login_username", "user name", "benutzername", "login", "email", "e-mail");
  const iPw = spalte("password", "login_password", "passwort", "kennwort");
  const iName = spalte("title", "name", "titel", "account");
  const iNote = spalte("note", "notes", "notiz", "notizen", "extra");
  if (iPw < 0 || (iUrl < 0 && iName < 0)) return null;
  return zeilen.slice(1).map(z => {
    const url = iUrl >= 0 ? (z[iUrl] || "").trim() : "";
    let titel = iName >= 0 ? (z[iName] || "").trim() : "";
    // App-Zugänge aus Chrome: android://…@com.whatsapp wird zu whatsapp.com
    const app = /^android:\/\/[^@]*@([^/]+)/i.exec(url) || /^android:\/\/[^@]*@([^/]+)/i.exec(titel);
    const host = app ? app[1].split(".").reverse().join(".") : hostVon(url);
    if (app && /^android:/i.test(titel)) titel = host;
    return { host, titel: titel && !/^https?:/i.test(titel) ? titel : host || titel, benutzer: iUser >= 0 ? (z[iUser] || "").trim() : "", passwort: (z[iPw] || "").trim(), notiz: iNote >= 0 ? (z[iNote] || "").trim() : "" };
  }).filter(e => e.passwort && (e.titel || e.host));
}

/* OHNE-TEXTE-ENDE */

async function passwoerterImportieren(datei) {
  if (!tresor.schluessel) return;
  const alle = passwoerterLesen(await datei.text());
  if (!alle || !alle.length) { melden("Keine Passwörter gefunden", "Die Datei hat nicht das erwartete Format. Bitte wählen Sie die Exportdatei Ihres Browsers oder Passwort-Managers mit der Endung .csv."); return; }
  const istBank = e => BANKEN.some(b => (e.host + " " + e.titel).toLowerCase().includes(b));
  const banken = alle.filter(istBank);
  const rest = alle.filter(e => !istBank(e));
  const schl = (a, b) => a.toLowerCase() + "|" + b.toLowerCase();
  // Doppelte erkennen am Anbieter, nicht am Namen: „Netflix“ aus Chrome und „netflix.com“ aus Firefox sind dasselbe Konto.
  const kennung = (name, host) => { const a = anbieterFinden(name) || anbieterFinden(host || ""); return a ? a.id : (host || hostVon(name.split(" ")[0]) || name); };
  const da = new Set(tresor.inhalt.eintraege.map(e => schl(kennung(e.bezeichnung), e.benutzer)));
  const neu = [];
  for (const e of rest) {
    const k = schl(kennung(e.titel, e.host), e.benutzer);
    if (da.has(k)) continue;
    da.add(k);
    const art = ONLINE_ART.find(([re]) => re.test(e.host + " " + e.titel.toLowerCase()));
    neu.push({ art: art && art[1] === "email" ? "email" : "online", bezeichnung: e.titel, benutzer: e.benutzer, passwort: e.passwort, notiz: e.notiz });
  }
  // Im Digitalen Nachlass nur Konten, die Angehörige kennen sollten: bekannte Anbieter und erkannte Arten.
  const dk = zustand.daten.digital.konten;
  const daDigital = new Set(dk.map(k => schl(k.anbieter, k.benutzername)));
  const digital = [];
  for (const e of neu) {
    const a = anbieterFinden(e.bezeichnung, "dienst") || anbieterFinden(e.host || "", "dienst");
    const art = ONLINE_ART.find(([re]) => re.test((e.bezeichnung + " ").toLowerCase()));
    if (!a && !art) continue;
    const anbieter = a ? a.name : e.bezeichnung;
    if (daDigital.has(schl(anbieter, e.benutzer))) continue;
    daDigital.add(schl(anbieter, e.benutzer));
    digital.push({ anbieter, benutzername: e.benutzer, wunsch: "", uebertragenAn: "", notiz: "" });
  }
  const ok = await fragen("Passwörter übernehmen?",
    [t("Gefunden: {n} Zugänge. Neu für Ihre Zugangsdaten: {neu}. Davon kommen {digital} bekannte Online-Konten ohne Passwort zusätzlich in den Digitalen Nachlass.", { n: alle.length, neu: neu.length, digital: digital.length }),
     banken.length ? t("{n} Bankzugänge werden ausgelassen.", { n: banken.length }) : null].filter(Boolean),
    [{ text: "Übernehmen", wert: true, primaer: true }, { text: "Abbrechen", wert: false }]);
  if (!ok) return;
  tresor.inhalt.eintraege.push(...neu);
  dk.push(...digital);
  if (neu.length) tresorGeaendert();
  if (digital.length) geaendert();
  inhaltZeigen();
  await melden("Bitte löschen Sie jetzt die Exportdatei",
    t("{n} Zugänge sind jetzt verschlüsselt in Klarordner gespeichert.", { n: neu.length }),
    "Die Exportdatei enthält alle Ihre Passwörter unverschlüsselt. Löschen Sie sie jetzt, auch aus dem Download-Ordner und dem Papierkorb. Auf dem iPad: in der Dateien-App lange antippen, „Löschen“ und danach unter „Zuletzt gelöscht“ endgültig löschen.");
}

function statischeTexte() {
  document.documentElement.lang = sprache;
  for (const knoten of document.querySelectorAll("[data-t]")) knoten.textContent = t(knoten.dataset.t);
  $("navigation").setAttribute("aria-label", t("Bereiche"));

}

function spracheSetzen(code) {
  sprache = code in SPRACHEN ? code : "de";
  try { localStorage.setItem("klarordner.sprache", sprache); } catch {}
  statischeTexte();
  startseiteFuellen();
  alles();
}

function spracheWaehlen() {
  const dlg = $("dialog");
  $("dialogTitel").textContent = t("Sprache wählen");
  $("dialogText").replaceChildren(el("div", { class: "sprachliste" },
    ...Object.entries(SPRACHEN).map(([code, name]) => el("button", {
      type: "button", lang: code, class: "btn" + (code === sprache ? " primaer" : ""), text: name,
      onclick: () => { dlg.close(); spracheSetzen(code); }
    }))));
  $("dialogKnoepfe").replaceChildren(el("button", { type: "button", class: "btn", text: t("Abbrechen"), onclick: () => dlg.close() }));
  dlg.onclose = null;
  dlg.showModal();
  dlg.querySelector(".sprachliste .primaer").focus();
}

function startSprache() {
  try {
    const gemerkt = localStorage.getItem("klarordner.sprache");
    if (gemerkt in SPRACHEN) return gemerkt;
  } catch {}
  for (const l of navigator.languages || [navigator.language || ""]) {
    const code = l.slice(0, 2).toLowerCase();
    if (code in SPRACHEN) return code;
  }
  return "de";
}

// Ausstehende Eingaben sofort ablegen, wenn die App in den Hintergrund geht.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "hidden") return;
  if (tresorTimer) tresorSichern().then(imGeraetSpeichern);
  else if (speicherTimer) imGeraetSpeichern();
});

window.addEventListener("beforeunload", e => {
  if (speicherTimer || tresorTimer || (!zustand.geraetOk && zustand.geaendert)) {
    e.preventDefault();
    e.returnValue = "";
  }
});

// Unter einer eigenen Adresse läuft Klarordner als installierbare Web-App, die nach dem ersten Laden offline funktioniert.
if (location.protocol === "https:" || location.hostname === "localhost") {
  document.querySelector('link[rel="apple-touch-icon"]').remove();
  document.head.append(
    el("link", { rel: "manifest", href: "manifest.webmanifest" }),
    el("link", { rel: "apple-touch-icon", href: "icons/icon-180.png" }));
  if ("serviceWorker" in navigator) {
    // Eine neue Version wird im Hintergrund geladen. Sobald sie bereitsteht, bietet die App das Neuladen an.
    const hatteVersion = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hatteVersion) neueVersionMelden(); });
    navigator.serviceWorker.register("sw.js").then(reg => {
      // Auf dem iPad bleibt die App oft tagelang geöffnet, deshalb auch beim Zurückkehren nachsehen.
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  }
}

function neueVersionMelden() {
  if ($("neueVersion")) return;
  const knopf = el("button", { type: "button", class: "btn primaer", text: t("Jetzt neu laden") });
  knopf.addEventListener("click", async () => {
    knopf.disabled = true;
    if (speicherTimer) await imGeraetSpeichern();
    location.reload();
  });
  document.body.append(el("div", { class: "neueversion", id: "neueVersion", role: "status" },
    el("span", { text: t("Eine neue Version von Klarordner ist da. Ihre Eingaben bleiben erhalten.") }), knopf));
}

async function starten() {
  anbieterListe();

  startseiteFuellen();
  if (zustand.geraetOk) {
    try {
      const gespeichert = await speicher.lesen();
      if (gespeichert && gespeichert.daten) {
        Object.assign(zustand, {
          daten: einlesen(JSON.stringify(gespeichert.daten)),
          dateiname: gespeichert.dateiname || standardName(),
          gesichertAm: gespeichert.gesichertAm || null,
          geaendert: !!gespeichert.geaendert,
          zuletzt: gespeichert.zuletzt || null
        });
      }
    } catch {
      zustand.geraetOk = false;
    }
  }
  alles();
  aktualitaetPruefen();
}

starten();
